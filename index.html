<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#E6E6E8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#08080A" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cockpit">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>PARA Cockpit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: floating white sidebar + glass cards on a soft grey studio backdrop; black pills carry state (after the Management Dashboard reference) */
:root{
  --bg:#E6E6E8; --bg-hi:#FAFAFB; --panel:rgba(255,255,255,.80); --panel-solid:#FFFFFF;
  --line:rgba(14,14,16,.08); --line-2:rgba(14,14,16,.16);
  --ink:#0D0D0F; --on-ink:#FFFFFF; --text:#111113; --muted:#7A7A82; --soft:#F0F0F2;
  --dark:#0E0E10; --on-dark:#F4F4F5; --dark-muted:#8C8C94; --dark-line:rgba(255,255,255,.12);
  --sheen:rgba(255,255,255,.16); --sheen2:rgba(255,255,255,.07);
  --late:#C2412D; --good:#2F7A4E;
  --shadow:0 1px 0 rgba(255,255,255,.7) inset, 0 18px 40px -24px rgba(20,20,30,.28);
  --r-lg:28px; --r-md:20px; --r-sm:14px;
  --f-ui:"Manrope", ui-sans-serif, system-ui, "Segoe UI", sans-serif;
  --f-num:"JetBrains Mono", ui-monospace, "Cascadia Mono", monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#08080A; --bg-hi:#1A1A1E; --panel:rgba(22,22,25,.84); --panel-solid:#17171A;
  --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.16);
  --ink:#F2F2F3; --on-ink:#0D0D0F; --text:#EDEDEF; --muted:#8E8E97; --soft:#222226;
  --dark:#EDEDEF; --on-dark:#0E0E10; --dark-muted:#5F5F67; --dark-line:rgba(0,0,0,.12);
  --sheen:rgba(255,255,255,.9); --sheen2:rgba(0,0,0,.05);
  --late:#FF7A61; --good:#5BC78A;
  --shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 18px 40px -24px rgba(0,0,0,.8);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08080A; --bg-hi:#1A1A1E; --panel:rgba(22,22,25,.84); --panel-solid:#17171A;
  --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.16);
  --ink:#F2F2F3; --on-ink:#0D0D0F; --text:#EDEDEF; --muted:#8E8E97; --soft:#222226;
  --dark:#EDEDEF; --on-dark:#0E0E10; --dark-muted:#5F5F67; --dark-line:rgba(0,0,0,.12);
  --sheen:rgba(255,255,255,.9); --sheen2:rgba(0,0,0,.05);
  --late:#FF7A61; --good:#5BC78A;
  --shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 18px 40px -24px rgba(0,0,0,.8);
  color-scheme:dark}

*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
[hidden]{display:none!important}
img{max-width:100%}
html,body{min-height:100%}
body{margin:0;font:500 14px/1.45 var(--f-ui);color:var(--text);
  background:radial-gradient(60% 50% at 78% 8%,var(--bg-hi) 0%,transparent 70%),
             radial-gradient(45% 40% at 8% 92%,var(--bg-hi) 0%,transparent 70%),var(--bg);
  background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);gap:20px;padding:16px;max-width:1500px;margin:0 auto}
.side{position:sticky;top:calc(16px + env(safe-area-inset-top,0px));height:calc(100vh - 32px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
  background:var(--panel);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--shadow);display:flex;flex-direction:column;padding:22px 14px 16px;gap:4px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 10px 22px;font-weight:800;font-size:15px;letter-spacing:-.01em}
.brand-mark{width:30px;height:30px;border-radius:10px;background:var(--ink);color:var(--on-ink);display:grid;place-items:center;font-size:13px;font-weight:800}
.nav-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:14px 12px 6px}
.nav{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:999px;color:var(--muted);font-weight:600;text-align:left;transition:background .15s,color .15s}
.nav:hover{color:var(--text);background:var(--soft)}
.nav.on{background:var(--ink);color:var(--on-ink)}
.nav .cnt{margin-left:auto;font-size:11px;opacity:.7}
.side-foot{margin-top:auto;padding:14px 10px 0;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--good)} .dot.warn{background:var(--late)}

.main{min-width:0;display:flex;flex-direction:column;gap:20px;padding-bottom:40px}
.top{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;padding:8px 4px 0}
.top h1{font-size:clamp(28px,3.4vw,40px);line-height:1.05;font-weight:600;letter-spacing:-.035em;margin:0;text-wrap:balance}
.top .sub{color:var(--muted);font-size:13px;margin-top:8px;display:flex;align-items:center;gap:8px}
.top-tools{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search{position:relative}
.search input{width:min(280px,60vw);height:44px;border-radius:999px;border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(14px);padding:0 16px 0 42px;outline:none;box-shadow:var(--shadow)}
.search input:focus{border-color:var(--line-2)}
.search > svg{position:absolute;left:15px;top:13px;color:var(--muted)}
.search-res{position:absolute;right:0;top:52px;width:min(380px,calc(100vw - 32px));background:var(--panel-solid);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--shadow);padding:6px;z-index:40;max-height:60vh;overflow:auto}
.rbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow)}
.rbtn.ink{background:var(--ink);color:var(--on-ink);border-color:transparent}
.rbtn:hover{transform:translateY(-1px)}

/* ---------- primitives ---------- */
.card{background:var(--panel);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:22px;min-width:0}
.card.dark{background:radial-gradient(90% 70% at 88% 0%,var(--sheen) 0%,transparent 55%),radial-gradient(70% 60% at 0% 110%,var(--sheen2) 0%,transparent 60%),var(--dark);color:var(--on-dark);border-color:transparent}
.card.dark .muted{color:var(--dark-muted)}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.card-h h2{font-size:15px;font-weight:700;margin:0;letter-spacing:-.01em}
.card-h .grow{flex:1}
.muted{color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:999px;border:1px solid var(--line-2);font-size:12px;font-weight:600;white-space:nowrap;background:transparent}
.pill.on{background:var(--ink);color:var(--on-ink);border-color:transparent}
.pills{display:flex;gap:6px;flex-wrap:wrap}
button.pill:hover:not(.on){background:var(--soft)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;background:var(--soft);font-size:11.5px;font-weight:600;color:var(--text);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button.chip:hover{background:var(--line-2)}
.chip.late{color:var(--late)}
.chip.ex{background:transparent;border:1px dashed var(--line-2);color:var(--muted)}
.tdot{width:8px;height:8px;border-radius:50%;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 16px;border-radius:999px;background:var(--ink);color:var(--on-ink);font-weight:700;font-size:13px;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line-2)}
.btn.danger{background:var(--late);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.field{width:100%;height:40px;border-radius:12px;border:1px solid var(--line-2);background:var(--panel-solid);padding:0 12px;outline:none}
.field:focus{border-color:var(--ink)}
textarea.field{height:auto;padding:10px 12px;resize:vertical;line-height:1.55}
.add{display:flex;gap:8px;align-items:center;border:1px dashed var(--line-2);border-radius:999px;padding:4px 4px 4px 16px}
.add input{flex:1;min-width:0;border:0;background:transparent;outline:none;height:34px}
.empty{padding:22px;border:1px dashed var(--line-2);border-radius:var(--r-md);color:var(--muted);font-size:13px;line-height:1.55}
.empty b{color:var(--text)}
.check{width:22px;height:22px;border-radius:50%;border:1.6px solid var(--line-2);display:grid;place-items:center;flex:none;transition:background .15s}
.check svg{width:13px;height:13px;stroke-width:2.6;opacity:0}
.check.on{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.check.on svg{opacity:1}
.check:hover:not(.on){border-color:var(--ink)}

/* ---------- dashboard ---------- */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.span2{grid-column:span 2}
.span3{grid-column:1/-1}
.tl{display:grid;grid-template-columns:150px minmax(0,1fr);row-gap:10px}
.tl-head{grid-column:2;position:relative;height:18px;font-size:10.5px;color:var(--muted)}
.tl-head span{position:absolute;top:0;transform:translateX(-0%)}
.tl-label{font-size:12.5px;color:var(--muted);text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:12px;align-self:center}
.tl-label:hover{color:var(--text)}
.tl-track{position:relative;height:34px;background-image:linear-gradient(to right,var(--line) 1px,transparent 1px);background-size:calc(100%/6) 100%}
.tl-bar{position:absolute;top:2px;height:30px;border-radius:999px;background:var(--ink);color:var(--on-ink);display:flex;align-items:center;gap:8px;padding:0 6px 0 14px;font-size:12px;font-weight:700;min-width:0;overflow:hidden;transition:transform .15s}
.tl-bar:hover{transform:translateY(-1px)}
.tl-bar span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tl-bar em{margin-left:auto;font-style:normal;font-family:var(--f-num);font-size:10.5px;background:var(--on-ink);color:var(--ink);border-radius:999px;padding:3px 7px;flex:none}
.tl-bar.open{background:transparent;color:var(--text);border:1.5px dashed var(--line-2)}
.tl-bar.open em{background:var(--soft);color:var(--text)}
.tl-bar.late{box-shadow:0 0 0 2px var(--late)}
.tl-today{position:absolute;top:-5px;bottom:-5px;width:0;border-left:1.5px solid var(--late);pointer-events:none;z-index:1}
.tl-bar{z-index:2}
.card.dark button.pill:hover{background:rgba(127,127,127,.22)}
.tl-body{grid-column:1/-1;display:grid;grid-template-columns:150px minmax(0,1fr);row-gap:10px;position:relative}
.big{font-size:44px;line-height:1;font-weight:600;letter-spacing:-.04em}
.habit-row{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.habit-row .t{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.streak{font-size:11px;color:var(--muted);white-space:nowrap}
.task-row{display:flex;align-items:center;gap:12px;padding:8px 8px 8px 10px;border:1px solid var(--line-2);border-radius:999px;min-width:0}
.task-row + .task-row{margin-top:8px}
.task-row .t{flex:1;min-width:0;text-align:left;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task-row.done .t{color:var(--muted);text-decoration:line-through}
.task-row .t{flex:1 1 60%}
.task-row .chip{flex:0 1 auto;min-width:0}
.areas{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:22px}
.area-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.area-col{border-top:1px solid var(--dark-line);padding-top:12px;text-align:left;min-width:0}
.area-col b{display:block;font-size:14px;margin-bottom:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.area-col .kv{display:flex;justify-content:space-between;font-size:12px;padding:2px 0}
.bars{display:flex;align-items:flex-end;gap:5px;height:120px;border-bottom:1px solid var(--dark-line)}
.bars i{flex:1;background:var(--on-dark);opacity:.35;border-radius:4px 4px 1px 1px;min-height:3px}
.bars i.today{opacity:1}
.recent{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}

/* ---------- lists ---------- */
.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.toolbar .add{flex:1;min-width:220px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.item{display:flex;flex-direction:column;gap:10px;text-align:left;padding:18px;border-radius:var(--r-md);background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);min-width:0;transition:transform .15s}
.item:hover{transform:translateY(-2px)}
.item h3{margin:0;font-size:15.5px;font-weight:700;letter-spacing:-.01em;overflow-wrap:anywhere}
.item p{margin:0;color:var(--muted);font-size:13px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.item .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:auto}
.item .thumb{height:120px;border-radius:12px;background:var(--soft) center/cover no-repeat}
.prog{height:6px;border-radius:999px;background:var(--soft);overflow:hidden}
.prog i{display:block;height:100%;background:var(--ink);border-radius:999px}
.rows{display:flex;flex-direction:column}
.hgrid{display:grid;grid-template-columns:repeat(14,22px);gap:5px}
.hcell{width:22px;height:22px;border-radius:7px;background:var(--soft);border:1px solid var(--line)}
.hcell.on{background:var(--ink);border-color:var(--ink)}
.hcell.today{outline:1.5px solid var(--ink);outline-offset:1px}
.hrow{display:flex;align-items:center;gap:16px;padding:14px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.hrow .t{flex:1;min-width:160px;text-align:left}
.hrow .t b{display:block;font-size:15px}
.set-row{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.set-row input[type=color]{width:38px;height:38px;border:1px solid var(--line-2);border-radius:12px;padding:3px;background:var(--panel-solid)}
.set-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.hint{font-size:12.5px;color:var(--muted);line-height:1.55;margin:0 0 12px}
code{font-family:var(--f-num);font-size:12px;background:var(--soft);padding:1px 5px;border-radius:6px}

/* ---------- detail drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,10,12,.28);backdrop-filter:blur(2px);z-index:50}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--panel-solid);z-index:51;display:flex;flex-direction:column;
  border-left:1px solid var(--line);box-shadow:-30px 0 60px -30px rgba(0,0,0,.35);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.d-head{display:flex;align-items:center;gap:8px;padding:16px 18px;border-bottom:1px solid var(--line)}
.d-head .grow{flex:1}
.d-scroll{overflow:auto;padding:18px 22px 40px;display:flex;flex-direction:column;gap:22px}
.d-scroll > *{flex-shrink:0}
.d-title{width:100%;border:0;outline:none;background:transparent;font-size:26px;font-weight:700;letter-spacing:-.03em;line-height:1.2;resize:none;padding:0;overflow:hidden}
.d-fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.d-fields label,.sec-l{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;font-weight:700}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:center;gap:8px}
.sec-h .sec-l{margin:0;flex:1}
.rel-group{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.rel-group > span{font-size:12px;color:var(--muted);width:100%}
.relchip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line-2);border-radius:999px;padding:0 4px 0 10px;height:30px;font-size:12.5px;font-weight:600;max-width:100%}
.relchip button.o{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
.relchip button.x{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.relchip button.x:hover{background:var(--soft);color:var(--text)}
.relchip button.x svg{width:13px;height:13px}
.picker{border:1px solid var(--line-2);border-radius:var(--r-sm);padding:10px;display:flex;flex-direction:column;gap:8px}
.pick-res{display:flex;flex-direction:column;max-height:240px;overflow:auto}
.res{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;text-align:left;width:100%}
.res:hover{background:var(--soft)}
.res .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.res small{color:var(--muted);font-size:11px}
.lrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-sm);min-width:0}
.lrow .t{flex:1;min-width:0}
.lrow .t a,.lrow .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-decoration:none}
.lrow .t small{display:block;color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow img{width:44px;height:44px;border-radius:10px;object-fit:cover;flex:none}
/* ---------- Bilder-Galerie im Eintrag ---------- */
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.shot{margin:0;display:flex;flex-direction:column;gap:5px;min-width:0}
.shot-img{position:relative;width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:var(--soft);display:grid;place-items:center;font-size:11px;color:var(--muted)}
.shot-img img{width:100%;height:100%;object-fit:cover;display:block}
.shot-t{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.72);color:#fff;font-size:10.5px;padding:1px 7px;border-radius:999px}
.shot figcaption{font-size:12px;line-height:1.35;color:var(--text);overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.lightbox{position:fixed;inset:0;z-index:60;background:rgba(5,5,7,.94);display:flex;flex-direction:column;color:#fff}
.lb-img{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:calc(60px + env(safe-area-inset-top,0px)) 16px 8px;min-height:0}
.lb-img img{max-width:100%;max-height:100%;object-fit:contain;border-radius:10px}
.lb-cap{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.lb-cap .pill{color:#fff;border-color:rgba(255,255,255,.3);text-decoration:none}
.lb-in{flex:1 1 260px;min-width:0;height:40px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;padding:0 12px;font-size:16px;outline:none}
.lb-in:focus{border-color:rgba(255,255,255,.6)}
.lightbox .ibtn{color:#fff;background:rgba(255,255,255,.12)}
.lb-x{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center}
.lb-nav.l{left:10px}.lb-nav.r{right:10px}
.ibtn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--muted);flex:none;text-decoration:none}
.ibtn:hover{background:var(--soft);color:var(--text)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal button{aspect-ratio:1;max-width:100%;border-radius:10px;background:var(--soft);font-size:11px;color:var(--muted);border:1px solid var(--line)}
.cal button.on{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.cal button.today{outline:1.5px solid var(--ink);outline-offset:1px}
.confirm{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 14px;border-radius:var(--r-sm);background:var(--soft);font-size:13px}

/* ---------- new dialog / toast ---------- */
.modal{position:fixed;left:50%;top:14vh;transform:translateX(-50%);width:min(520px,calc(100% - 32px));background:var(--panel-solid);border-radius:var(--r-lg);z-index:52;padding:22px;box-shadow:0 30px 80px -30px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:14px;border:1px solid var(--line)}
.modal h2{margin:0;font-size:18px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--on-ink);padding:10px 18px;border-radius:999px;font-weight:600;font-size:13px;z-index:60;max-width:calc(100% - 32px);text-align:center}
.banner{display:flex;gap:10px;align-items:center;padding:12px 16px;border-radius:var(--r-md);background:var(--panel);border:1px dashed var(--line-2);font-size:13px;color:var(--muted)}

/* ---------- login ---------- */
body.auth .side,body.auth .bottom{display:none}
body.auth .app{grid-template-columns:minmax(0,1fr)}
.login{min-height:calc(100vh - 80px);display:grid;place-items:center;padding-block:24px}
.login-card{width:min(420px,100%);padding:30px}
.login-h{font-size:30px;letter-spacing:-.035em;margin:0 0 8px;font-weight:600}
.login-form{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.login-form .field{height:46px;margin-bottom:8px;font-size:16px}
.login-form .btn{height:48px;margin-top:6px}
.l-msg{font-size:13px;color:var(--late)}
.top .sub{flex-wrap:wrap}

/* ---------- heute / rückblick / notizen / sortieren / stichwörter ---------- */
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.hin{display:inline-flex;align-items:center;gap:6px;flex:none}
.hin input{width:76px;height:32px;border-radius:999px;border:1px solid var(--line-2);background:var(--panel-solid);padding:0 10px;text-align:right;outline:none}
.hin input:focus{border-color:var(--ink)}
.hin.ok input{border-color:var(--good);box-shadow:0 0 0 1px var(--good) inset}
.hin small{color:var(--muted);font-size:11.5px}
.hpills{display:flex;gap:4px;flex-wrap:wrap;flex:none}
.hpills .pill{height:28px;padding:0 10px}
.hcell.part{background:var(--line-2);border-color:var(--line-2)}
.cal button.part{background:var(--line-2)}
.sub-h{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:14px 0 8px}
.sub-h:first-child{margin-top:0}
.step{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.step > .t{flex:1;min-width:140px;text-align:left;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step .task-row{flex:2;min-width:220px;margin:0}
.step .add{flex:2;min-width:220px}
.stepn{width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--on-ink);display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}
.md-tools{display:flex;gap:6px;flex-wrap:wrap}
.mded{position:relative;min-height:170px;padding:12px 14px;border:1px solid var(--line-2);border-radius:12px;background:var(--panel-solid);outline:none;font-size:15px;line-height:1.6;overflow-wrap:anywhere;white-space:pre-wrap;counter-reset:ol}
.mded:focus{border-color:var(--ink)}
.mded[data-empty="1"]::before{content:attr(data-ph);position:absolute;left:14px;top:12px;right:14px;color:var(--muted);pointer-events:none}
.mded > div{position:relative;min-height:1.6em}
.mded > [data-t=h1]{font-size:23px;font-weight:700;letter-spacing:-.025em;line-height:1.3;margin:.55em 0 .1em}
.mded > [data-t=h2]{font-size:19px;font-weight:700;letter-spacing:-.02em;line-height:1.3;margin:.5em 0 .1em}
.mded > [data-t=h3]{font-size:16px;font-weight:700;line-height:1.35;margin:.45em 0 .05em}
.mded > [data-t]:first-child{margin-top:0}
.mded > [data-t=ul],.mded > [data-t=ol],.mded > [data-t=cb]{padding-left:28px}
.mded > [data-t=ul]::before{content:"•";position:absolute;left:9px;top:0;font-weight:800}
.mded > :not([data-t=ol]){counter-set:ol 0}
.mded > [data-t=ol]{counter-increment:ol}
.mded > [data-t=ol]::before{content:counter(ol) ".";position:absolute;left:3px;top:0;font-variant-numeric:tabular-nums;color:var(--muted);font-weight:700}
.mded > [data-t=cb]::before{content:"";position:absolute;left:1px;top:.22em;width:18px;height:18px;border-radius:50%;border:1.6px solid var(--line-2);box-sizing:border-box;cursor:pointer}
.mded > [data-t=cb][data-c=x]::before,.mded > [data-t=cb][data-done="1"]::before{background:var(--ink);border-color:var(--ink);box-shadow:inset 0 0 0 3px var(--panel-solid)}
.mded > [data-t=cb][data-c=x],.mded > [data-t=cb][data-done="1"]{color:var(--muted);text-decoration:line-through}
.mded > [data-t=cb][data-c=">"]::after{content:"Aufgabe";margin-left:8px;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--soft);color:var(--muted);text-decoration:none;display:inline-block;vertical-align:1px}
.mded > [data-t=quote]{border-left:3px solid var(--line-2);padding-left:12px;color:var(--muted)}
.mded > [data-t=hr]{min-height:0;height:1px;background:var(--line-2);margin:14px 0}
.mded b,.mded strong{font-weight:800}
.mded code{font-size:13px}
.mded a{text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.handle{cursor:grab;touch-action:none;color:var(--muted);display:grid;place-items:center;width:24px;height:28px;flex:none;border-radius:8px}
.handle:hover{background:var(--soft);color:var(--text)}
.handle svg{stroke-width:3.2}
.item .handle{position:absolute;top:10px;right:10px}
.item{position:relative}
.dragging{opacity:.4}
.tags-in{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1px solid var(--line-2);border-radius:12px;padding:6px 8px;background:var(--panel-solid)}
.tags-in input{flex:1;min-width:140px;border:0;outline:none;background:transparent;height:28px}
.mnav{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.mnav b{flex:1;text-align:center;font-size:13px}
.mchart{display:flex;align-items:flex-end;gap:2px;height:110px;position:relative;border-bottom:1px solid var(--line-2);margin-top:14px}
.mchart i{flex:1;background:var(--ink);border-radius:3px 3px 1px 1px}
.mchart i.miss{opacity:.3}
.mchart .goal{position:absolute;left:0;right:0;border-top:1.5px dashed var(--late);pointer-events:none}
.mlabels{display:flex;justify-content:space-between;font-size:10.5px;margin-top:5px}
.pop .scrim{z-index:54} .pop .modal{z-index:55}

/* ---------- mobile ---------- */
.bottom{display:none}
/* ---------- Kalender ---------- */
.cal-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cal-navg{display:flex;align-items:center;gap:6px;margin-left:auto;min-width:0}
.cal-bar .lbl{font-weight:700;font-size:13.5px;margin-left:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:14px}
.cal-strip button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;border-radius:var(--r-sm);border:1px solid var(--line);font-size:11px;color:var(--muted);font-weight:700}
.cal-strip button b{font-size:16px;color:var(--text)}
.cal-strip button::after{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;opacity:0}
.cal-strip button.cust::after{opacity:.7}
.cal-strip button.today b{text-decoration:underline;text-underline-offset:3px}
.cal-strip button.on{background:var(--ink);border-color:transparent;color:var(--on-ink)}
.cal-strip button.on b{color:var(--on-ink)}
.cal-allday{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip.evt{background:var(--ink);color:var(--on-ink)}
.cal-scroll{overflow-x:auto;margin:0 -8px;padding:0 8px}
.cal-grid{display:grid;grid-template-columns:44px repeat(var(--cols),minmax(var(--colw),1fr))}
.cal-hours{position:relative}
.cal-hours span{position:absolute;right:8px;transform:translateY(-50%);font-size:10.5px;color:var(--muted)}
.cal-col{position:relative;border-left:1px solid var(--line);border-top:1px solid var(--line);cursor:copy;background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% var(--hh)}
.cal-colh{display:flex;flex-direction:column;align-items:center;padding:2px 0 8px;font-size:11px;color:var(--muted);font-weight:700;min-width:0}
.cal-colh b{font-size:15px;color:var(--text);padding:0 7px;border-radius:999px}
.cal-colh.today b{background:var(--ink);color:var(--on-ink)}
.cal-colh small{font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-ad{display:flex;flex-direction:column;gap:4px;padding:0 3px 6px;min-width:0}
.cal-ev{position:absolute;border-radius:10px;padding:3px 7px;font-size:12px;line-height:1.25;text-align:left;overflow:hidden;z-index:1;
  background:color-mix(in srgb,var(--c) 18%,var(--panel-solid));border-left:3px solid var(--c);color:var(--text)}
.cal-ev b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-ev small{display:block;color:var(--muted);font-size:10.5px}
.cal-ev.event{background:var(--ink);color:var(--on-ink);border-left-color:var(--ink);z-index:2}
.cal-ev.event small{color:inherit;opacity:.7}
.cal-ev.off{opacity:.4}
.cal-ev.short{padding:0 6px;display:flex;align-items:center;font-size:11px;line-height:1.15}
.cal-ev.short b span{font-weight:600;opacity:.65}
.cal-ev.off b{text-decoration:line-through}
.cal-ev.pt{border-radius:999px}
.cal-now{position:absolute;left:0;right:0;height:2px;background:var(--late);z-index:3;pointer-events:none}
.cal-now::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--late)}
.plan-row{display:grid;grid-template-columns:28px 104px 104px minmax(0,1fr) 32px;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.plan-row .field{height:36px;padding:0 8px}
.bs-row{display:grid;grid-template-columns:minmax(0,1.3fr) 104px minmax(0,1fr) 32px;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.bs-row .field{height:36px;padding:0 10px}
.bs-head{border-top:0;padding:0 0 2px;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.bs-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.bs-kpis>div{border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.bs-kpis span{font-size:12px;color:var(--muted)}
.bs-kpis b{font-size:18px;white-space:nowrap}
.bs-kpis small{font-size:12px;color:var(--muted)}
.bs-lbl{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:16px 0 6px}
.bs-goal{height:auto;min-height:84px;padding:10px 12px;resize:vertical;line-height:1.45;font:inherit}
.bs-log{padding:10px 0;border-top:1px solid var(--line)}
.bs-log-h{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px}
.bs-log-h .ibtn{margin-left:auto;width:28px;height:28px}
.bs-chg{margin:4px 0 8px;font-size:14px;overflow-wrap:anywhere}
.bs-chg s{color:var(--muted)}
.bs-delta{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;border:1px solid var(--line-2);margin-left:4px}
.bs-log .field{height:34px;font-size:13px}
@media (max-width:560px){.bs-row{grid-template-columns:minmax(0,1fr) 92px 32px}.bs-row .bs-3{grid-column:1/3;order:5}.bs-head .bs-3{display:none}}
.tr-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tr-tabs .pill{height:32px;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.tr-new{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tr-new .muted{font-size:12px;margin-right:2px}
.tr-meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}
.tr-meta label{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:var(--muted)}
.tr-meta .field{font-weight:400;color:var(--text);font-size:14px}
.tr-meta .tr-wide{grid-column:1/-1}
.tr-meta textarea.field{min-height:64px}
.tr-kpis{margin-top:14px}
.tr-dh{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.tr-dh .tr-dayname{flex:1 1 220px;width:auto;height:40px;font-weight:700;font-size:15px}
.tr-dh .ibtn{width:30px;height:30px}
.tr-row{display:grid;grid-template-columns:22px minmax(0,1fr) 64px 104px 84px 72px 96px;gap:8px;align-items:center;padding:5px 8px;border-top:1px solid var(--line)}
.tr-row .field{height:36px;padding:0 10px}
.tr-c{display:block;min-width:0}
.tr-c>span{display:none}
.tr-c .field{text-align:center;padding:0 6px}
.tr-n{font-size:12px;color:var(--muted);text-align:right}
.tr-acts{display:flex;justify-content:flex-end}
.tr-acts .ibtn{width:30px;height:30px}
.tr-head{background:var(--ink);color:var(--on-ink);border-radius:10px;border-top:0;padding:8px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.tr-head>span{text-align:center}.tr-head>span:nth-child(2){text-align:left}.tr-head>span:first-child{text-align:right}
.tr-foot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.tr-legend b{color:var(--text)}
.tr-seg{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 16px}
.tr-seg .pill{height:34px;padding:0 14px;font-size:13px}
.tr-dbadd{display:grid;grid-template-columns:minmax(0,1fr) 170px auto;gap:8px}
.tr-dbadd .pill{height:40px}
.tr-dbq{margin-top:12px}
.tr-dblist{max-height:min(60vh,560px);overflow-y:auto;overscroll-behavior:contain;border:1px solid var(--line);border-radius:14px;margin-top:10px}
.tr-dbg{position:sticky;top:0;z-index:1;background:var(--panel-solid);padding:9px 12px 6px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-bottom:1px solid var(--line)}
.tr-dbrow{display:grid;grid-template-columns:minmax(0,1.3fr) 150px minmax(0,1fr) 32px;gap:8px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line)}
.tr-dbrow:last-child{border-bottom:0}
.tr-dbrow .field{height:36px;padding:0 10px}
.tr-dbempty{padding:14px;font-size:13px;color:var(--muted)}
.tr-dd{position:fixed;z-index:58;background:var(--panel-solid);border:1px solid var(--line-2);border-radius:14px;box-shadow:var(--shadow);overflow-y:auto;overscroll-behavior:contain;padding:4px;-webkit-overflow-scrolling:touch}
/* Boards (Whiteboard) */
.bd-tpls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bd-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.bd-grid > .empty{grid-column:1/-1}
.bd-card{position:relative;border-radius:var(--r-md);background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden;min-width:0;transition:transform .15s}
.bd-card:hover{transform:translateY(-2px)}
.bd-open{display:flex;flex-direction:column;width:100%;text-align:left;min-width:0}
.bd-th{width:100%;aspect-ratio:16/10;background:#fff center/contain no-repeat;border-bottom:1px solid var(--line);display:grid;place-items:center;color:#adb5bd}
.bd-th .i{width:34px;height:34px}
.bd-cb{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;min-width:0;width:100%}
.bd-cb h3{margin:0;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bd-cb .meta{display:flex;gap:4px;flex-wrap:wrap;color:var(--muted);font-size:12px}
.bd-more{position:absolute;top:8px;right:8px;background:var(--panel-solid);box-shadow:var(--shadow)}
.bd-dprev{display:flex;flex-direction:column;align-items:flex-start;gap:10px;width:100%}
.bd-dprev img{width:100%;max-height:220px;object-fit:contain;border-radius:12px;border:1px solid var(--line);background:#fff}
body.bd-on{overflow:hidden}
.bd-ov{position:fixed;inset:0;z-index:48;background:var(--bg-hi);display:flex;flex-direction:column}
.bd-bar{display:flex;align-items:center;gap:8px;padding:8px 10px;padding-top:calc(8px + env(safe-area-inset-top,0px));background:var(--panel-solid);border-bottom:1px solid var(--line);min-width:0}
.bd-bar .rbtn{width:36px;height:36px;box-shadow:none;flex:none}
.bd-title{flex:1 1 120px;min-width:70px;font:inherit;font-weight:700;font-size:15px;border:0;background:transparent;color:var(--text);padding:6px 8px;border-radius:10px}
.bd-title:focus{outline:none;background:var(--soft)}
.bd-state{flex:none}
.bd-tools{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:0 1 auto;min-width:0}
.bd-tools::-webkit-scrollbar{display:none}
.bd-tools .pill{height:34px;flex:none}
.bd-canvas{flex:1;position:relative;min-height:0}
.bd-load{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-weight:600;padding:20px;text-align:center}
.bd-menu{position:fixed;z-index:49;top:calc(58px + env(safe-area-inset-top,0px));right:10px;width:min(380px,calc(100vw - 20px));max-height:min(72vh,580px);overflow-y:auto;background:var(--panel-solid);border:1px solid var(--line-2);border-radius:16px;box-shadow:var(--shadow);padding:6px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.bd-mh{padding:8px 12px 6px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.bd-mi{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;padding:9px 12px;border-radius:12px}
.bd-mi:hover,.bd-mi:focus-visible{background:var(--soft)}
.bd-mi b{font-size:13.5px}
.bd-mi small{color:var(--muted);font-size:12px;line-height:1.35}
.bd-sw{display:flex;flex-wrap:wrap;gap:10px;padding:6px 12px 10px}
.bd-sw button{width:46px;height:46px;border-radius:10px;border:1px solid rgba(0,0,0,.08);box-shadow:0 2px 6px rgba(0,0,0,.1)}
.bd-sw button.on{outline:2px solid var(--ink);outline-offset:2px}
.bd-tm{display:flex;flex-wrap:wrap;gap:8px;padding:4px 12px 10px;align-items:center}
.bd-tm .pill{height:34px}
.bd-tm input{width:76px;height:34px}
.bd-q{padding:4px 6px 6px}
.bd-tips{margin:0;padding:2px 12px 10px 28px;font-size:13px;line-height:1.5}
.bd-tips li{margin:5px 0}
.bd-tips b{font-weight:700}
.bd-pres{position:absolute;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:5;display:flex;align-items:center;gap:4px;background:rgba(13,13,15,.86);color:#fff;border-radius:999px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.bd-pres button{height:38px;min-width:38px;padding:0 12px;border-radius:999px;color:#fff;font-weight:700;display:grid;place-items:center}
.bd-pres button:hover{background:rgba(255,255,255,.14)}
.bd-pres span{padding:0 6px;font-size:13px;font-weight:600;white-space:nowrap;max-width:46vw;overflow:hidden;text-overflow:ellipsis}

.bd-timer span{font-variant-numeric:tabular-nums}

}

function dashboardHTML(){

function timelineHTML(){
  const t = today0(); const start = addDays(t, -((t.getDay()+6)%7)); const DAYS = 42; const end = addDays(start, DAYS);
  const pct = d => Math.max(0, Math.min(100, (d - start) / (end - start) * 100));
  const projs = live("project").filter(p => (p.status || "aktiv") !== "erledigt")
    .sort((a, b) => (a.due || "9999").localeCompare(b.due || "9999")).slice(0, 7);
  const nowL = pct(t) + 50 / DAYS;
  const ticks = Array.from({length:6}, (_, w) => `<span class="num" style="left:${w/6*100}%">KW ${isoWeek(addDays(start, w*7))}</span>`).join("");
  const rows = projs.map(p => {
    const s = p.start ? parseKey(p.start) : new Date(p.created || Date.now());
    const e = p.due ? addDays(parseKey(p.due), 1) : null;
    let left = pct(s), right = e ? pct(e) : 100;
    if (right - left < 14) { left = Math.min(left, 86); right = left + 14; }
    const late = e && e <= t; const pr = progress(p);
    return `<button class="tl-label" data-open="${p.id}" title="${esc(p.title)}">${esc(p.title || "Ohne Titel")}</button>
      <div class="tl-track"><i class="tl-today" style="left:${nowL}%"></i><button class="tl-bar ${e ? "" : "open"} ${late ? "late" : ""}" style="left:${left}%;width:${right-left}%" data-open="${p.id}" title="${esc(p.title)}${p.due ? " · bis " + fmtDay(p.due) : " · ohne Enddatum"}">
        <span>${esc(p.title || "Ohne Titel")}</span><em>${pr.total ? `${pr.done}/${pr.total}` : PSTATUS[p.status] || "Aktiv"}</em></button></div>`;
  }).join("");
  return `<div class="card-h"><h2>Projekte &amp; Ziele</h2><span class="grow"></span><button class="pill" data-go="project">Alle ansehen</button></div>
    ${projs.length ? `<div class="tl"><div class="tl-head">${ticks}</div><div class="tl-body">${rows}</div></div>`
      : `<div class="empty"><b>Noch keine aktiven Projekte.</b><br>Lege ein Projekt oder Ziel mit Enddatum an. Es erscheint dann hier auf der Zeitleiste der nächsten sechs Wochen.</div>`}`;
}

    return `<span class="hpills">${opts.map(o => `<button class="pill ${v === o ? "on" : ""}" data-act="hpick" data-id="${h.id}" data-day="${k}" data-val="${esc(o)}">${esc(o)}</button>`).join("")}</span>`; }

function dayEntries(d){

  const evs = d.events.filter(e => toMin(e.from) != null).map(e => { const s = toMin(e.from), en = toMin(e.to), pt = en == null; return {kind:"event", id:e.id, s, e: pt ? s : en > s ? en : s + 60, pt, title:e.title || "Termin", c:"var(--ink)"}; });

  for (const b of bls) b.off = evs.some(v => !v.pt && v.s < Math.max(b.e, b.s + 1) && v.e > b.s);
  const list = [...evs, ...bls].sort((a, b) => a.s - b.s || b.pt - a.pt || b.e - a.e);

          ${p.ref && S.items.has(p.ref) ? `<button class="btn ghost" data-open="${p.ref}">Eintrag öffnen</button>` : ""}
          <button class="btn ${d.plan ? "ghost" : ""}" data-act="cp-save" data-scope="day">Nur an diesem Tag</button>

function calSave(scope){
  const p = calPopRead(); if (!p) return;
  const title = (p.title || "").trim(); if (!title) { toast("Gib dem Eintrag einen Titel."); $("#cp-title").focus(); return; }
  const a = toMin(p.from); let b = toMin(p.to);
  if (scope === "event") {
    if (!p.allday && a == null) { toast("Bitte eine Startzeit angeben oder „Ganztägig“ wählen."); return; }
    if (!p.allday && !p.point && (b == null || b <= a)) b = a + 60;
    create("event", title, {date:p.day, from: p.allday ? "" : toHM(a), to: p.allday || p.point ? "" : toHM(b), hidePlan: !!p.hide});
    closePop(); renderMain(); toast("Termin angelegt. Antippen für Ort, Notizen und Links."); return;
  }
  if (a == null) { toast("Bitte eine Startzeit angeben."); return; }
  if (!p.point && (b == null || b <= a)) b = Math.min(1439, a + 30);
  const blk = {id: p.id || uid(), start: toHM(a), end: p.point ? "" : toHM(b), title, color: p.color || CAL_COLORS[0]}; if (p.ref) blk.ref = p.ref;
  const put = list => { const i = list.findIndex(x => x.id === blk.id); if (i >= 0) list[i] = {...blk}; else list.push({...blk}); return sortBlocks(list); };
  if (scope === "plan") {
    const d = dayPlan(p.day); if (!d.plan) { toast("An diesem Tag gilt keine Vorlage."); return; }
    ownPlans(); const plan = planById(d.plan.id); plan.blocks = put(plan.blocks); saveSettings(0);
    if (d.o && Array.isArray(d.o.blocks) && d.o.blocks.some(x => x.id === blk.id)) { d.o.blocks = put(d.o.blocks); persist(d.o); }
    toast(`In der Vorlage „${plan.name}“ gespeichert`);
  } else { const o = dayOwn(p.day); o.blocks = put(o.blocks); persist(o); toast("Nur für diesen Tag gespeichert"); }
  closePop(); renderMain();
}
function calDel(scope){
  const p = S.pop; if (!p || !p.id) return;
  if (scope === "plan") {
    const d = dayPlan(p.day);
    if (d.plan) { ownPlans(); const plan = planById(d.plan.id); plan.blocks = plan.blocks.filter(x => x.id !== p.id); saveSettings(0); }
    if (d.o && Array.isArray(d.o.blocks)) { d.o.blocks = d.o.blocks.filter(x => x.id !== p.id); persist(d.o); }
    toast("Aus der Vorlage gelöscht");
  } else { const o = dayOwn(p.day); o.blocks = o.blocks.filter(x => x.id !== p.id); persist(o); toast("Nur an diesem Tag entfernt"); }
  closePop(); renderMain();
}

// Monatsansicht einer Gewohnheit: Kalender, bei Zahlen zusätzlich Balken mit Ziellinie
function habitMonthHTML(h){
  const base = new Date(); base.setHours(0,0,0,0); base.setDate(1); base.setMonth(base.getMonth() + (S.hMonth || 0));
  const y = base.getFullYear(), m = base.getMonth(); const n = new Date(y, m + 1, 0).getDate(); const t = today0(); const tk = dkey();
  const days = Array.from({length:n}, (_, i) => new Date(y, m, i + 1));
  const past = days.filter(d => d <= t); const hit = past.filter(d => hdone(h, dkey(d))).length;
  let extra = "";
  if (hmode(h) === "number") {
    const vals = days.map(d => { const v = hval(h, dkey(d)); return typeof v === "number" ? v : null; });
    const logged = vals.filter(v => v != null); const goal = +h.goal || 0;
    const max = Math.max(goal, ...logged, 1) * 1.1; const avg = logged.length ? logged.reduce((a, b) => a + b, 0) / logged.length : null;
    extra = `<div class="mchart" aria-label="Werte im Monat">${goal ? `<span class="goal" style="bottom:${goal / max * 100}%" title="Ziel ${fmtNum(goal)}"></span>` : ""}${vals.map((v, i) => `<i class="${v != null && goal && v < goal ? "miss" : ""}" style="height:${v == null ? 0 : Math.max(2, v / max * 100)}%" title="${fmtDay(dkey(days[i]))}: ${v == null ? "–" : fmtNum(v) + " " + esc(h.unit || "")}"></i>`).join("")}</div>
      <div class="mlabels muted num"><span>1.</span><span>${Math.ceil(n / 2)}.</span><span>${n}.</span></div>
      <p class="muted" style="font-size:12.5px;margin:8px 0 0">${avg != null ? `Durchschnitt <b style="color:var(--text)">${fmtNum(avg)} ${esc(h.unit || "")}</b> · ` : ""}Ziel erreicht an ${hit} von ${past.length} Tagen${goal ? "" : " (lege ein Tagesziel fest)"}</p>`;
  } else if (hmode(h) === "choice") {
    const cnt = {}; for (const d of days) { const v = hval(h, dkey(d)); if (typeof v === "string" && v) cnt[v] = (cnt[v] || 0) + 1; }
    extra = `<p class="muted" style="font-size:12.5px;margin:8px 0 0">${Object.entries(cnt).map(([k, c]) => `${esc(k)} <b style="color:var(--text)" class="num">${c}×</b>`).join(" · ") || "Noch nichts eingetragen"} · an ${hit} von ${past.length} Tagen</p>`;
  } else extra = `<p class="muted" style="font-size:12.5px;margin:8px 0 0">Erledigt an ${hit} von ${past.length} Tagen${past.length ? ` (${Math.round(hit / past.length * 100)} %)` : ""}</p>`;
  const lead = isoDay(days[0]) - 1;
  const cal = `<div class="cal">${WD.map(d => `<span class="muted" style="font-size:10.5px;text-align:center">${d}</span>`).join("")}${"<span></span>".repeat(lead)}${days.map(d => { const k = dkey(d); const fut = d > t;
    return `<button class="${hdone(h, k) ? "on" : hpart(h, k) ? "part" : ""} ${k === tk ? "today" : ""}" ${fut ? "disabled style='opacity:.35'" : ""} data-act="hday" data-id="${h.id}" data-day="${k}" aria-label="${k}"><span class="num">${d.getDate()}</span></button>`; }).join("")}</div>`;
  return `<div class="mnav"><button class="ibtn" data-act="hmon" data-d="-1" aria-label="Voriger Monat">${ic("left")}</button><b>${base.toLocaleDateString("de-DE", {month:"long", year:"numeric"})}</b><button class="ibtn" data-act="hmon" data-d="1" aria-label="Nächster Monat" ${(S.hMonth || 0) >= 0 ? "disabled style='opacity:.3'" : ""}>${ic("right")}</button></div>${cal}${extra}`;
}

function bsCur(key){ const b = basis(); if (key === "goal") return {x:b, f:"goal", list:""}; const [list, id, f] = key.split("|"); const x = (b[list] || []).find(y => y.id === id); return x ? {x, f, list} : null; }

/* Sortieren per Ziehen: Griff [data-drag] in einer Liste [data-sort], Einträge mit [data-sid] */
let drag = null;
document.addEventListener("pointerdown", e => {
  const hnd = e.target.closest("[data-drag]"); if (!hnd) return;
  const el = hnd.closest("[data-sid]"); const box = el && el.parentElement; if (!box || !box.dataset.sort) return;
  e.preventDefault(); drag = {el, box, moved:false}; el.classList.add("dragging");
  try { hnd.setPointerCapture(e.pointerId); } catch(err){}
});
document.addEventListener("pointermove", e => {
  if (!drag) return; e.preventDefault();
  const over = document.elementFromPoint(e.clientX, e.clientY); const tgt = over && over.closest("[data-sid]");
  if (!tgt || tgt === drag.el || tgt.parentElement !== drag.box) return;
  const r = tgt.getBoundingClientRect(); const grid = getComputedStyle(drag.box).display === "grid" && r.width < drag.box.clientWidth * 0.9;
  const after = grid ? e.clientX > r.left + r.width / 2 : e.clientY > r.top + r.height / 2;
  drag.box.insertBefore(drag.el, after ? tgt.nextSibling : tgt);
  drag.moved = true;
}, {passive:false});
function endDrag(){
  if (!drag) return; const {el, box, moved} = drag; drag = null; el.classList.remove("dragging");
  S.justDragged = Date.now(); if (!moved) return;
  [...box.querySelectorAll(":scope > [data-sid]")].forEach((n, i) => { const x = S.items.get(n.dataset.sid); if (x && x.order !== i) { x.order = i; persist(x); } });
  const key = box.dataset.sort; if (key !== "habit" && sortMode(key) !== "manual") { S.settings.sort = {...(S.settings.sort || {}), [key]: "manual"}; saveSettings(); }
  renderMain();
}
document.addEventListener("pointerup", endDrag); document.addEventListener("pointercancel", endDrag);

const BD_NOTES = [["gelb","#fff3a3","Gelb"],["orange","#ffd8a8","Orange"],["rosa","#fcc2d7","Rosa"],["lila","#e5dbff","Lila"],["blau","#d0ebff","Blau"],["gruen","#d3f9d8","Grün"],["grau","#e9ecef","Grau"]];

const bdTheme = () => (document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";

function boardsHTML(){

function bdCard(b){

    <div class="bd-cb"><h3>${esc(b.title || "Ohne Titel")}</h3><div class="meta"><span class="num">${n} ${n === 1 ? "Element" : "Elemente"}</span><span>· ${fmtTs(b.updated)}</span>${rc ? `<span class="num">· ↔ ${rc}</span>` : ""}</div>${tagChips(b)}</div></button>

function bdLoad(){
  if (!S.bdMod) {
    window.EXCALIDRAW_ASSET_PATH = new URL("vendor/excalidraw/", location.href).href;
    if (!$("#bd-css")) { const l = document.createElement("link"); l.id = "bd-css"; l.rel = "stylesheet"; l.href = "vendor/excalidraw/board.css"; document.head.appendChild(l); }
    S.bdMod = import("./vendor/excalidraw/board.js").catch(e => { S.bdMod = null; throw e; });
  }

// Nach dem ersten Öffnen alle Kern-Dateien einmal abrufen, damit der Offline-Speicher sie hat
function bdPrefetch(){
  if (S.bdPre || !navigator.onLine || !navigator.serviceWorker || !navigator.serviceWorker.controller) return; S.bdPre = true;
  fetch("vendor/excalidraw/core.json").then(r => r.json()).then(list => { let i = 0; const next = () => { if (i < list.length) fetch("vendor/excalidraw/" + list[i++]).catch(() => {}).finally(next); }; for (let k = 0; k < 4; k++) next(); }).catch(() => {});
}
function bdShellHTML(it){

  return `<div class="bd-ov" id="board-ov" role="dialog" aria-label="Board">
    <div class="bd-bar"><button class="rbtn" data-act="bd-close" title="Zurück zu den Boards" aria-label="Schließen">${ic("left")}</button>
      <input class="bd-title" id="bd-title" value="${esc(it.title)}" placeholder="Board-Name" aria-label="Board-Name" autocomplete="off">
      <span class="chip bd-state" id="bd-state">Speichert automatisch</span>
      <div class="bd-tools">${b("bd-menu", "layout", "Vorlagen", 'data-m="tpl"')}${b("bd-menu", "sticky", "Notiz", 'data-m="note"')}${b("bd-menu", "link", "Eintrag", 'data-m="card"')}${b("bd-present", "play", "Präsentieren")}
        <button class="pill bd-timer" id="bd-timer" data-act="bd-menu" data-m="timer" title="Timer">${ic("clock")}<span>Timer</span></button>${b("bd-menu", "tip", "Tipps", 'data-m="help"')}${b("bd-info", "pen", "Details")}</div></div>
    <div class="bd-canvas" id="bd-canvas"><div class="bd-load">Board wird geladen …</div></div>
    <div class="bd-pres" id="bd-pres" hidden></div>
    <div class="bd-menu" id="bd-menu" hidden></div></div>`;
}
async function bdOpen(id, tpl, focusTitle){
  const it = S.items.get(id); if (!it) return;
  if (S.bd) await bdClose(true);
  closeOverlay(); $("#side").classList.remove("open");
  S.bd = {id, menu:null, changed:false, ver:it.updated};
  document.body.insertAdjacentHTML("beforeend", bdShellHTML(it)); document.body.classList.add("bd-on");
  if (focusTitle) { const t = $("#bd-title"); t.focus(); t.select(); }
  let mod; try { mod = await bdLoad(); } catch(e) { const c = $("#bd-canvas"); if (c) c.innerHTML = `<div class="bd-load">Das Board konnte nicht geladen werden. Beim allerersten Öffnen brauchst du Internet, danach geht es auch offline.</div>`; return; }
  if (!S.bd || S.bd.id !== id) return;
  const box = $("#bd-canvas"); box.innerHTML = "";
  let view = null; try { view = JSON.parse(localStorage.getItem("para-cockpit.bview." + id) || "null"); } catch(e){}
  const lib = S.items.get("boardlib");
  const ctrl = mod.mount(box, {
    elements:it.elements || [], files:it.bfiles || {}, bg:it.bg, grid:it.grid, view, library:lib ? lib.items || [] : [],
    theme:bdTheme(), libraryReturnUrl:location.origin + location.pathname,
    onSave:sc => bdSave(id, sc), onView:v => { try { localStorage.setItem("para-cockpit.bview." + id, JSON.stringify(v)); } catch(e){} },
    onLibraryChange:items => bdLib(items), onLinkOpen:url => bdLink(url),
  });
  S.bd.ctrl = ctrl;
  await ctrl.ready; await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
  if (tpl && S.bd && S.bd.ctrl === ctrl) ctrl.insertTemplate(tpl);
  bdPrefetch();
}
async function bdClose(silent, gone){
  const b = S.bd; if (!b) return;
  S.bd = null; bdTimerStop(); const ov = $("#board-ov"); if (ov) ov.style.display = "none";
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  if (b.ctrl) {
    if (b.ctrl.present.active) b.ctrl.present.stop();
    if (!gone) {
      b.ctrl.flush();
      if (b.changed) { try { const t = await b.ctrl.thumb(); const cur = S.items.get(b.id); if (cur && t !== (cur.thumb || "")) { cur.thumb = t; persist(cur); } } catch(e){} }
    }
    b.ctrl.destroy();
  }
  if (ov) ov.remove(); if (!S.bd) document.body.classList.remove("bd-on");
  if (!silent) { renderMain(); renderSide(); }
  if (S.updatePending && !S.bd && !S.open) applyUpdate(false);
}
// Großes Bild verkleinern (max. 1600 px, WebP), damit der Abgleich schnell bleibt
function bdShrink(f){
  const keep = {id:f.id, mimeType:f.mimeType, dataURL:f.dataURL, created:f.created || Date.now()};
  if (!f.dataURL || f.dataURL.length < 450000 || !/^data:image\/(png|jpeg|webp)/.test(f.dataURL)) return Promise.resolve(keep);
  return new Promise(res => { const img = new Image();
    img.onload = () => { try { const m = Math.min(1, 1600 / Math.max(img.width, img.height)); const c = document.createElement("canvas"); c.width = Math.round(img.width * m); c.height = Math.round(img.height * m); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      const d = c.toDataURL("image/webp", .82); res(d.startsWith("data:image/webp") && d.length < f.dataURL.length ? {...keep, dataURL:d, mimeType:"image/webp"} : keep); } catch(e) { res(keep); } };
    img.onerror = () => res(keep); img.src = f.dataURL; });
}
async function bdSave(id, sc){
  if (!S.items.has(id)) return;
  const old = S.items.get(id).bfiles || {}, files = {};
  for (const [fid, f] of Object.entries(sc.files || {})) files[fid] = old[fid] || await bdShrink(f);
  const it = S.items.get(id); if (!it) return;
  it.elements = sc.elements; it.bfiles = files; it.bg = sc.bg; it.grid = sc.grid; persist(it);
  if (S.bd && S.bd.id === id) { S.bd.changed = true; const st = $("#bd-state"); if (st) st.textContent = "Gespeichert " + new Date().toLocaleTimeString("de-DE", {hour:"2-digit", minute:"2-digit"}); }
  if (!S.bdWarned && JSON.stringify(it).length > 6e6) { S.bdWarned = true; toast("Dieses Board ist sehr groß (über 6 MB). Viele große Bilder machen den Abgleich langsam."); }
}
// Änderung von einem anderen Gerät: offenes Board aktualisieren, wenn hier gerade nichts ungespeichert ist
function bdRemote(){
  if (!S.bd || !S.bd.ctrl) return;
  const it = S.items.get(S.bd.id);
  if (!it) { bdClose(false, true); toast("Dieses Board wurde auf einem anderen Gerät gelöscht."); return; }
  if (it.updated === S.bd.ver || S.dirty.has(it.id)) return;
  S.bd.ver = it.updated; S.bd.ctrl.replace({elements:it.elements || [], files:it.bfiles || {}, bg:it.bg, grid:it.grid});
  const t = $("#bd-title"); if (t && document.activeElement !== t) t.value = it.title || "";
}
function bdLib(items){
  clearTimeout(S.bdLibT);
  S.bdLibT = setTimeout(() => {
    const json = JSON.stringify(items || []); let it = S.items.get("boardlib");
    if (it && JSON.stringify(it.items || []) === json) return;
    if (!it) { if (json === "[]") return; it = {id:"boardlib", kind:"boardlib", title:"Board-Bibliothek", body:"", rel:[], links:[], files:[], tags:[], archived:false, created:Date.now()}; }
    it.items = JSON.parse(json); persist(it);
  }, 800);
}
function bdLink(url){
  const m = /#open=([\w-]+)/.exec(url || ""); if (!m) return false;
  if (S.items.has(m[1])) openDetailFresh(m[1]); else toast("Diesen Eintrag gibt es nicht mehr.");
  return true;
}
function bdMenu(m){
  if (!S.bd) return; S.bd.menu = m; const box = $("#bd-menu"); if (!box) return;
  box.hidden = !m; if (!m) { box.innerHTML = ""; return; }
  if (m === "tpl") box.innerHTML = `<div class="bd-mh">Vorlage einfügen</div>${BOARD_TPL.map(t => `<button class="bd-mi" data-act="bd-tpl" data-id="${t.id}"><b>${esc(t.name)}</b><small>${esc(t.desc)}</small></button>`).join("")}`;
  if (m === "note") box.innerHTML = `<div class="bd-mh">Haftnotiz einfügen</div><div class="bd-sw">${BD_NOTES.map(([id, c, n]) => `<button data-act="bd-note" data-c="${id}" class="${(S.bdNote || "gelb") === id ? "on" : ""}" style="background:${c}" title="${n}" aria-label="${n}e Notiz"></button>`).join("")}</div><p class="hint" style="margin:0 12px 10px">Doppelklick auf eine Notiz, um zu schreiben. Strg + D dupliziert sie, Alt + Ziehen auch.</p>`;
  if (m === "card") { box.innerHTML = `<div class="bd-mh">Eintrag aus dem Cockpit einfügen</div><div class="bd-q"><input class="field" id="bd-q" placeholder="Projekt, Aufgabe, Notiz suchen …" autocomplete="off" aria-label="Eintrag suchen"></div><div id="bd-qres"></div>`; bdCardRes(""); setTimeout(() => { const q = $("#bd-q"); if (q && matchMedia("(pointer:fine)").matches) q.focus(); }, 30); }
  if (m === "timer") box.innerHTML = `<div class="bd-mh">Timer</div>${S.bdTimer ? `<div class="bd-tm"><button class="pill" data-act="bd-tstop">Timer stoppen</button></div>` : ""}<div class="bd-tm">${[1, 3, 5, 10, 15, 25, 45].map(n => `<button class="pill num" data-act="bd-tstart" data-min="${n}">${n} min</button>`).join("")}</div><div class="bd-tm"><input class="field num" id="bd-tmin" type="number" min="1" max="600" placeholder="Min." aria-label="Minuten"><button class="pill" data-act="bd-tstart">Starten</button></div>`;
  if (m === "help") box.innerHTML = `<div class="bd-mh">So nutzt du das Board</div><ul class="bd-tips">
    <li><b>Haftnotizen:</b> Knopf „Notiz“, dann Doppelklick zum Schreiben.</li>
    <li><b>Rahmen (Taste F):</b> fasst Bereiche zusammen. Beim Präsentieren wird jeder Rahmen eine Folie.</li>
    <li><b>Verbinden:</b> Pfeil (A) von Form zu Form ziehen. Form markieren und <b>Strg + Pfeiltaste</b> erzeugt einen verbundenen Knoten wie in einer Mindmap.</li>
    <li><b>Text zu Diagramm:</b> Werkzeugleiste → „Weitere Werkzeuge“ → Mermaid. Daraus wird ein fertiges Diagramm.</li>
    <li><b>Bilder, PDFs als Bild, Screenshots:</b> hineinziehen oder mit Strg + V einfügen.</li>
    <li><b>Webseiten und YouTube einbetten:</b> „Weitere Werkzeuge“ → Web-Einbettung, Link einfügen.</li>
    <li><b>Laserpointer (K)</b> zum Zeigen, <b>Hand (H)</b> zum Verschieben, Mausrad + Strg zum Zoomen.</li>
    <li><b>Bibliothek:</b> eigene Bausteine speichern oder fertige Sammlungen auf libraries.excalidraw.com holen.</li>
    <li><b>Suchen:</b> Strg + F. <b>Alle Befehle:</b> Strg + /.</li>
    <li><b>Gruppieren</b> Strg + G, <b>Sperren</b> Strg + Shift + L, <b>Ausrichten</b> über die Leiste links bei Auswahl.</li>
    <li><b>Exportieren:</b> Menü ☰ → Bild exportieren (PNG, SVG, Zwischenablage) oder Datei speichern.</li>
    <li><b>Eintrag:</b> fügt eine Karte mit Link zu deinem Projekt oder deiner Notiz ein und verknüpft beides.</li>
  </ul>`;
}
function bdCardRes(q){
  const box = $("#bd-qres"); if (!box || !S.bd) return; q = (q || "").trim().toLowerCase();
  const list = live().filter(i => !HIDDEN_K.includes(i.kind) && i.kind !== "board" && i.id !== S.bd.id && !(i.kind === "task" && i.done) && (!q || (i.title || "").toLowerCase().includes(q))).sort((a, b) => b.updated - a.updated).slice(0, 40);
  box.innerHTML = list.map(i => `<button class="bd-mi" data-act="bd-card" data-id="${i.id}"><b>${esc(i.title || "Ohne Titel")}</b><small>${esc(kindOf(i).label)}</small></button>`).join("") || `<p class="hint" style="margin:6px 12px 10px">Nichts gefunden.</p>`;
}
function bdPresent(){
  const c = S.bd && S.bd.ctrl; if (!c) return;
  const n = c.present.start(); if (!n) { toast("Lege zuerst Rahmen an (Taste F oder Vorlage „Präsentation“). Jeder Rahmen wird eine Folie."); return; }
  S.bd.pres = true; const ov = $("#board-ov"); ov.classList.add("presenting");
  if (ov.requestFullscreen) ov.requestFullscreen().catch(() => {});
  bdPresUI(c.present.step(0));
}
function bdPresUI(r){
  const box = $("#bd-pres"); if (!box) return; box.hidden = !r; if (!r) { box.innerHTML = ""; return; }
  box.innerHTML = `<button data-act="bd-prev" aria-label="Vorherige Folie" ${r.i ? "" : "disabled"}>${ic("left")}</button><span>${r.i + 1} / ${r.n}${r.name ? " · " + esc(r.name) : ""}</span><button data-act="bd-next" aria-label="Nächste Folie" ${r.i < r.n - 1 ? "" : "disabled"}>${ic("right")}</button><button data-act="bd-pstop">Beenden</button>`;
}
function bdPresStop(){
  if (!S.bd || !S.bd.pres) return; S.bd.pres = false;
  if (S.bd.ctrl) S.bd.ctrl.present.stop(); const ov = $("#board-ov"); if (ov) ov.classList.remove("presenting"); bdPresUI(null);
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
}
function bdTimerStart(min){
  bdTimerStop(); S.bdTimer = {end:Date.now() + min * 60000, iv:setInterval(bdTimerTick, 250)}; bdTimerTick(); bdMenu(null);
}
function bdTimerTick(){
  const t = S.bdTimer, el = $("#bd-timer"); if (!t) return;
  const left = Math.max(0, t.end - Date.now()), s = Math.ceil(left / 1000);
  if (el) { el.classList.add("run"); el.querySelector("span").textContent = `${Math.floor(s / 60)}:${pad(s % 60)}`; }
  if (!left && !t.done) { t.done = true; clearInterval(t.iv); if (el) el.classList.add("end"); bdBeep(); toast("Die Zeit ist um."); try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch(e){} }
}
function bdTimerStop(){
  if (S.bdTimer) clearInterval(S.bdTimer.iv); S.bdTimer = null;
  const el = $("#bd-timer"); if (el) { el.classList.remove("end", "run"); el.querySelector("span").textContent = "Timer"; }
}
function bdBeep(){
  try { const a = new (window.AudioContext || window.webkitAudioContext)();
    [0, .35, .7].forEach(t => { const o = a.createOscillator(), g = a.createGain(); o.frequency.value = 880; o.connect(g); g.connect(a.destination);
      g.gain.setValueAtTime(.0001, a.currentTime + t); g.gain.exponentialRampToValueAtTime(.3, a.currentTime + t + .02); g.gain.exponentialRampToValueAtTime(.0001, a.currentTime + t + .25); o.start(a.currentTime + t); o.stop(a.currentTime + t + .3); });
  } catch(e){}
}
document.addEventListener("input", e => {
  const t = e.target; if (!S.bd) return;
  if (t.id === "bd-title") { const it = S.items.get(S.bd.id); if (it) { it.title = t.value; persist(it, 600); } return; }
  if (t.id === "bd-q") { bdCardRes(t.value); return; }
  if (t.id === "d-title" && S.open === S.bd.id) { const x = $("#bd-title"); if (x) x.value = t.value; }
});
document.addEventListener("keydown", e => {
  if (!S.bd) return;
  if (S.bd.pres && !S.open) {
    const c = S.bd.ctrl, k = e.key;
    if (["ArrowRight", "ArrowDown", "PageDown", " ", "Enter"].includes(k)) bdPresUI(c.present.step(1));
    else if (["ArrowLeft", "ArrowUp", "PageUp", "Backspace"].includes(k)) bdPresUI(c.present.step(-1));

    e.preventDefault(); e.stopPropagation(); return;
  }
  if (e.key === "Escape" && S.bd.menu && !S.open) { bdMenu(null); e.stopPropagation(); return; }
  if (e.key === "Enter" && e.target.id === "bd-title") { e.preventDefault(); e.target.blur(); return; }
  if (e.key === "Enter" && e.target.id === "bd-q") { e.preventDefault(); const f = $('#bd-qres [data-act="bd-card"]'); if (f) f.click(); }
}, true);
document.addEventListener("pointerdown", e => { if (S.bd && S.bd.menu && !e.target.closest("#bd-menu") && !e.target.closest('[data-act="bd-menu"]')) bdMenu(null); }, true);
try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (S.bd && S.bd.ctrl) S.bd.ctrl.setTheme(bdTheme()); }); } catch(e){}
document.addEventListener("fullscreenchange", () => { if (S.bd && S.bd.pres && S.bd.ctrl) setTimeout(() => S.bd && S.bd.pres && bdPresUI(S.bd.ctrl.present.step(0)), 250); });

function render(){ document.body.classList.toggle("auth", S.mode !== "app"); renderSide(); renderMain(); }
document.addEventListener("submit", async e => {
  if (e.target.id !== "login-form") return;
  e.preventDefault();
  const email = $("#l-email").value.trim(), pw = $("#l-pass").value, msg = $("#l-msg"), btn = $("#l-btn");

    const {data, error} = reg ? await sb.auth.signUp({email, password: pw, options: {emailRedirectTo: location.origin + location.pathname}}) : await sb.auth.signInWithPassword({email, password: pw});
    if (error) throw error;
    if (data && data.session) onSignedIn(data.session.user);

  finally { btn.disabled = false; }
});
