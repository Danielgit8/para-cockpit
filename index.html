<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F3EBDD" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1D1712" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Life OS">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Life OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..600&display=swap">
<style>
/* Life OS klein (17.11.2026): Heute · Ziele · Geld · Plus. Look „Cuisine de papier“ (Meine Personal Brand/design/stil.md), ruhig. */
:root{
  --papier:#F3EBDD; --papier-2:#EADFCB; --papier-3:#DFD1B8; --leinen:#FAF6EE;
  --tinte:#2B2119; --tinte-2:#5C4E42; --tinte-3:#8C7C6B;
  --linie:rgba(43,33,25,.14); --linie-2:rgba(43,33,25,.32);
  --bordeaux:#9B2B2C; --bordeaux-tief:#741E20; --senf:#C08A2E; --olive:#4E5A2C; --butter:#F0D58C;
  --soft-b:rgba(155,43,44,.08);
  --f-ui:"Newsreader","Iowan Old Style",Georgia,serif; --f-head:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --r:4px; --nav-h:64px; --safe-b:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --papier:#1D1712; --papier-2:#261E17; --papier-3:#31271E; --leinen:#2C231B;
  --tinte:#EFE5D3; --tinte-2:#C4B49C; --tinte-3:#A8977F;
  --linie:rgba(239,229,211,.11); --linie-2:rgba(239,229,211,.26);
  --bordeaux:#C9484A; --bordeaux-tief:#A8383A; --senf:#D9A54A; --olive:#A3B26A; --soft-b:rgba(201,72,74,.14);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --papier:#1D1712; --papier-2:#261E17; --papier-3:#31271E; --leinen:#2C231B;
  --tinte:#EFE5D3; --tinte-2:#C4B49C; --tinte-3:#A8977F;
  --linie:rgba(239,229,211,.11); --linie-2:rgba(239,229,211,.26);
  --bordeaux:#C9484A; --bordeaux-tief:#A8383A; --senf:#D9A54A; --olive:#A3B26A; --soft-b:rgba(201,72,74,.14);
  color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--papier);color:var(--tinte);font:400 17px/1.45 var(--f-ui);font-optical-sizing:auto;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums lining-nums}
::selection{background:var(--butter);color:#2B2119}
:focus-visible{outline:2px solid var(--bordeaux);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Kopf */
#hdr{position:sticky;top:0;z-index:20;background:var(--papier);border-bottom:1px solid var(--linie)}
.hdr-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:12px 16px 10px;padding-top:max(12px,env(safe-area-inset-top))}
.hdr-t{flex:1;min-width:0}
.hdr-t h1{margin:0;font:italic 600 28px/1.1 var(--f-head);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-t small{display:block;color:var(--tinte-3);font-size:14px;margin-top:2px}
.sync{width:9px;height:9px;border-radius:50%;background:var(--olive);flex:none}
.sync.warn{background:var(--senf)} .sync.busy{background:var(--tinte-3)}
.ibtn{width:44px;height:44px;display:grid;place-items:center;border:1px solid transparent;background:none;border-radius:50%;color:var(--tinte-2);flex:none}
.ibtn:hover{background:var(--papier-2)}
.ibtn.on{background:var(--tinte);color:var(--papier)}
.editbar{max-width:760px;margin:0 auto;padding:0 16px 10px;display:flex;flex-wrap:wrap;gap:8px}
.editbar .btn{min-height:40px;padding:6px 12px;font-size:15px}
.tabs{max-width:760px;margin:0 auto;padding:0 16px 10px;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px}
.tab{border:1px solid var(--linie-2);background:transparent;border-radius:var(--r);padding:6px 4px;min-height:44px;font-size:15px;line-height:1.15;color:var(--tinte-2);overflow-wrap:normal;word-break:keep-all;hyphens:none}
.tab.on{background:var(--tinte);color:var(--papier);border-color:var(--tinte)}

main{max-width:760px;margin:0 auto;padding:14px 16px calc(var(--nav-h) + 140px + var(--safe-b))}
.banner{border:1px solid var(--senf);background:color-mix(in srgb,var(--senf) 12%,transparent);padding:10px 12px;border-radius:var(--r);margin-bottom:12px;font-size:15px}
.empty{color:var(--tinte-3);font-style:italic;padding:28px 4px;text-align:center}

/* Listen */
.card{background:var(--leinen);border:1px solid var(--linie);border-radius:var(--r);padding:6px 14px 12px;margin-bottom:16px}
.card-h{display:flex;align-items:center;gap:8px;padding:8px 0 4px}
.card-h h2{flex:1;min-width:0;margin:0;font:italic 600 22px/1.2 var(--f-head)}
.path{padding-top:6px}
.path + .path{border-top:1px solid var(--linie);margin-top:8px}
.path-h{display:flex;align-items:center;gap:8px;padding:6px 0 2px}
.path-h h3{flex:1;min-width:0;margin:0;font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--bordeaux)}
.rows{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;gap:6px;min-height:48px;border-bottom:1px solid var(--linie)}
.row:last-child{border-bottom:0}
.row .tt{flex:1;min-width:0;overflow-wrap:break-word;hyphens:manual;padding:8px 0}
.row .tt small{display:block;color:var(--tinte-3);font-size:13.5px}
.row.done .edit-t .field{text-decoration:line-through;color:var(--tinte-3)}
.row.done .tt{color:var(--tinte-3);text-decoration:line-through;text-decoration-thickness:1px}
.row.note .tt{font-style:italic;color:var(--tinte-2)}
.chk{width:44px;height:44px;flex:none;display:grid;place-items:center;background:none;border:0;padding:0}
.chk span{width:26px;height:26px;border:1.6px solid var(--linie-2);border-radius:50%;display:grid;place-items:center;color:transparent;transition:background-color .15s,border-color .15s}
.chk.on span{background:var(--olive);border-color:var(--olive);color:var(--papier)}
.chk span .i{width:16px;height:16px;stroke-width:2.4}
.sun{width:44px;height:44px;flex:none;display:grid;place-items:center;background:none;border:0;color:var(--tinte-3);border-radius:50%}
.sun.on{color:var(--senf)}
.sun.on .i{fill:color-mix(in srgb,var(--senf) 35%,transparent)}
.ndot{width:44px;flex:none;display:grid;place-items:center;color:var(--tinte-3)}
.ndot .i{width:18px;height:18px}
.addrow{display:flex;gap:8px;padding-top:8px}
.addrow input{flex:1;min-width:0}
.field{width:100%;min-height:44px;padding:8px 10px;border:1px solid var(--linie-2);border-radius:var(--r);background:var(--papier);font-size:16px}
.field:focus{outline:none;border-color:var(--bordeaux);box-shadow:0 0 0 3px var(--soft-b)}
textarea.field{resize:none;field-sizing:content;min-height:44px;line-height:1.35}
.btn{min-height:44px;padding:8px 16px;border:1px solid var(--tinte);background:var(--tinte);color:var(--papier);border-radius:var(--r);font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--tinte);border-color:var(--linie-2)}
.btn.danger{background:var(--bordeaux);border-color:var(--bordeaux);color:#fff}
.btn.sq{width:44px;padding:0;flex:none}
.btn .i{width:20px;height:20px}
.more{width:40px;height:40px;flex:none;display:grid;place-items:center;border:1px solid var(--linie-2);background:var(--papier);border-radius:var(--r);color:var(--tinte-2)}
.grip{width:34px;height:44px;flex:none;display:grid;place-items:center;color:var(--tinte-3);touch-action:none;cursor:grab;background:none;border:0}
.dragging{opacity:.6;background:var(--papier-2)}
.is-hidden{opacity:.45}
.is-hidden .tt::after,.is-hidden h2::after,.is-hidden h3::after{content:" · ausgeblendet";font-size:12px;font-style:normal;letter-spacing:0;text-transform:none;color:var(--tinte-3)}
.edit-t{flex:1;min-width:0;padding:4px 0}
.edit-t .field{min-height:40px;padding:6px 8px}
.edit-t.g .field{font:italic 600 20px/1.2 var(--f-head)}
.edit-t.p .field{font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--bordeaux)}
.btnline{display:flex;align-items:center;gap:6px;margin-top:10px;flex-wrap:wrap}

/* Geld-Tabellen */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--linie);border-radius:var(--r);background:var(--leinen);max-width:100%}
table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%}
th,td{padding:4px 6px;border-bottom:1px solid var(--linie);text-align:right;vertical-align:middle;white-space:nowrap}
th{font-size:12.5px;font-weight:600;color:var(--tinte-2);white-space:normal;max-width:6.4em;line-height:1.2;padding-top:10px;padding-bottom:8px;word-break:keep-all;hyphens:none}
th.l,td.l{text-align:left}
.stick{position:sticky;left:0;z-index:1;background:var(--leinen);box-shadow:1px 0 0 var(--linie)}
td input{border:1px solid transparent;background:transparent;border-radius:3px;padding:6px 4px;min-height:40px;width:4.4em;text-align:right;font-size:16px}
td input:focus{outline:none;border-color:var(--bordeaux);background:var(--papier)}
td textarea.t{width:9.5em;text-align:left;border:1px solid transparent;background:transparent;border-radius:3px;padding:6px 4px;min-height:40px;resize:none;field-sizing:content;font-size:16px;line-height:1.25;white-space:normal;display:block}
td textarea.t:focus{outline:none;border-color:var(--bordeaux);background:var(--papier)}
tr.down textarea{color:var(--tinte-3)}
td select{border:1px solid var(--linie-2);background:var(--papier);border-radius:3px;min-height:40px;max-width:11em;font-size:16px;padding:4px}
td.c{color:var(--tinte-2);min-width:4.2em}
tr.down td{color:var(--tinte-3)}
tr.down input{color:var(--tinte-3)}
tr.down td small,.hint-down{display:block;font-size:12px;color:var(--bordeaux);font-style:italic;padding:0 4px 4px}
.thumb{width:44px;height:40px;border:1px solid var(--linie);border-radius:3px;background:var(--papier);display:inline-grid;place-items:center;color:var(--tinte-3)}
.thumb.up{color:var(--olive);border-color:var(--olive)}
.thumb.down{color:var(--bordeaux);border-color:var(--bordeaux)}
.thumb.down .i{transform:rotate(180deg)}
tfoot td{border-bottom:0;background:var(--papier-2)}
.sum{position:sticky;left:0;display:inline-flex;flex-wrap:wrap;column-gap:10px;row-gap:2px;align-items:baseline;padding:8px 4px;text-align:left;white-space:normal;max-width:calc(100vw - 52px)}
.sum b{font-size:18px}
.sum small{color:var(--tinte-3)}
td.ck{width:52px;text-align:center}
#tbl-shop{width:100%}
#tbl-shop td.l{white-space:normal;overflow-wrap:break-word}
tr.got td{color:var(--tinte-3)}
tr.got td.l{text-decoration:line-through}
.days{display:flex;align-items:center;gap:10px;margin:0 0 12px;font-size:17px}
.days input{width:4.5em;text-align:center}
.note-s{color:var(--tinte-3);font-size:14.5px;margin:10px 2px 0}
.sec-t{font:italic 600 20px/1.2 var(--f-head);margin:18px 0 8px}

/* Leiste unten und Plus */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--papier);border-top:1px solid var(--linie-2);padding-bottom:var(--safe-b)}
.nav-in{max-width:760px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);height:var(--nav-h)}
.nav-b{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--tinte-3);min-width:0;padding:0 4px;font-size:14px}
.nav-b span{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-b.on{color:var(--bordeaux);font-style:italic}
.nav-b.on .i{stroke-width:2}
#fab{position:fixed;right:max(16px,calc(50% - 364px));bottom:calc(var(--nav-h) + 16px + var(--safe-b));z-index:26;width:60px;height:60px;border-radius:50%;border:0;background:var(--bordeaux);color:#fff;display:grid;place-items:center;box-shadow:0 10px 24px -10px rgba(60,20,10,.6)}
#fab .i{width:28px;height:28px;stroke-width:2}
#fab.is-hidden{opacity:.4}
body.auth #nav,body.auth #fab,body.auth #hdr{display:none}

/* Blatt von unten */
#sheet:empty{display:none}
.scrim{position:fixed;inset:0;z-index:40;background:rgba(30,20,12,.38)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:88vh;overflow:auto;background:var(--leinen);border-top:1px solid var(--linie-2);border-radius:10px 10px 0 0;padding:14px 16px calc(16px + var(--safe-b));max-width:760px;margin:0 auto}
@media (min-width:700px) and (min-height:500px){.sheet{top:0;bottom:0;margin:auto;height:fit-content;max-width:560px;max-height:80vh;border:1px solid var(--linie-2);border-radius:10px;padding-bottom:18px;box-shadow:0 12px 40px rgba(0,0,0,.18)}}
.sheet.anim{animation:up .22s cubic-bezier(.23,1,.32,1)}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.sheet h2{margin:2px 0 12px;font:italic 600 22px/1.2 var(--f-head);display:flex;align-items:center;gap:8px}
.sheet h2 span{flex:1}
.sheet h3{margin:16px 0 6px;font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--bordeaux)}
.choose{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-top:12px}
.choose .btn{min-height:52px;font-size:17px;white-space:normal}
.lrow{display:flex;align-items:center;gap:6px;min-height:52px;border-bottom:1px solid var(--linie)}
.lrow input{flex:1;min-width:0}
.trow{display:flex;align-items:center;gap:10px;min-height:56px;border-bottom:1px solid var(--linie)}
.trow .tt{flex:1;min-width:0}
.trow small{display:block;color:var(--tinte-3);font-size:13.5px}
.stack{display:grid;gap:8px}
.stack .btn{justify-content:flex-start}
.muted{color:var(--tinte-3);font-size:14.5px}

/* Toast, Fenster, Login */
#toast-wrap{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + 90px + var(--safe-b));z-index:60;display:flex;justify-content:center;pointer-events:none;padding:0 16px}
.toast{pointer-events:auto;background:var(--tinte);color:var(--papier);padding:10px 14px;border-radius:var(--r);display:flex;gap:14px;align-items:center;max-width:520px;font-size:16px}
.toast-act{background:none;border:0;color:var(--papier);font-weight:700;text-decoration:underline;text-underline-offset:3px;min-height:36px;padding:0 4px}
.modal{position:fixed;z-index:51;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,calc(100vw - 32px));max-height:86vh;overflow:auto;background:var(--leinen);border:1px solid var(--linie-2);border-radius:6px;padding:18px;display:grid;gap:12px}
.modal h2{margin:0;font:italic 600 22px/1.2 var(--f-head)}
#pop .scrim{z-index:50}
.login{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.login-card{width:min(420px,100%);background:var(--leinen);border:1px solid var(--linie);border-radius:6px;padding:24px;display:grid;gap:10px}
.login-card h1{margin:0 0 4px;font:italic 600 30px/1.1 var(--f-head)}
.login-card label{font-size:14px;color:var(--tinte-2)}
.l-msg{min-height:20px;color:var(--bordeaux);font-size:15px}
.hint{color:var(--tinte-3);font-size:15px;margin:0}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}}
</style>
</head>
<body class="auth">
<header id="hdr"></header>
<main id="main" aria-live="polite"></main>
<nav id="nav" aria-label="Bereiche"></nav>
<button id="fab" type="button" aria-label="Notiz festhalten"></button>
<div id="sheet"></div>
<div id="pop"></div>
<div id="toast-wrap"></div>
<input type="file" id="import-file" accept=".json,.zip" hidden>

<script src="supabase.js"></script>
<script src="core.js"></script>

// Abgleich: 1) eigene Änderungen hochladen (der Server nimmt nur nicht ältere Fassungen an), 2) Abgelehnte klären, 3) Neues seitenweise holen.
async function sync(){
  clearTimeout(syncT);
  if (!sb || !S.user || S.syncing || S.mode !== "app") return;
  if (!navigator.onLine) { S.online = false; renderStatus(); return; }
  S.syncing = true; renderStatus();
  const before = banner(); const me = S.user.id;
  let changed = false;
  try {
    // Journal-Tage (der MCP-Server schreibt hinein) nie blind hochladen: zusammenführen und nur speichern, wenn der Server unverändert ist.
    const jd = [...S.dirty].filter(id => !S.tombs.has(id) && S.items.has(id) && S.items.get(id).kind === "jday"), jdSkip = new Set(jd);
    let jdAgain = false;
    if (PC.mergeJday) for (let i = 0; i < jd.length; i += 100) {
      const part = jd.slice(i, i + 100);
      const {data:srv, error} = await sb.from("items").select("id,data,updated_at,deleted").in("id", part);
      if (error) throw error;
      const byId = new Map((srv || []).map(r => [r.id, r]));
      for (const id of part) {
        const loc = S.items.get(id), r = byId.get(id); if (!loc) continue;
        let m = loc, res, sentU;
        if (r && !r.deleted && r.data && r.data.kind === "jday") {
          m = {...PC.mergeJday(r.data, loc), id}; m.updated = Math.max(Date.now(), loc.updated || 0, (r.updated_at || 0) + 1);
          S.items.set(id, m); changed = true; sentU = m.updated;
          res = await sb.from("items").update({data:clone(m), updated_at:m.updated, deleted:false}).eq("user_id", me).eq("id", id).eq("updated_at", r.updated_at).select("id");
        } else if (r) {
          if (m.updated <= r.updated_at) { m = {...loc, updated:r.updated_at + 1}; S.items.set(id, m); }
          sentU = m.updated;
          res = await sb.from("items").update({data:clone(m), updated_at:m.updated, deleted:false}).eq("user_id", me).eq("id", id).eq("updated_at", r.updated_at).select("id");
        } else {
          if (!m.updated) { m.updated = Date.now(); }
          sentU = m.updated;
          res = await sb.from("items").insert({user_id:me, id, data:clone(m), updated_at:m.updated, deleted:false}).select("id");
          if (res.error && (res.error.code === "23505" || /duplicate/i.test(res.error.message || ""))) res = {data:[]};
        }
        if (res.error) throw res.error;
        if (res.data && res.data.length) { if (S.items.get(id) === m && m.updated === sentU) S.dirty.delete(id); }
        else jdAgain = true;
      }
    }
    const rows = [];
    for (const id of [...S.dirty]) {
      if (jdSkip.has(id)) continue;
      if (S.tombs.has(id)) rows.push({user_id:me, id, data:{}, updated_at:S.delAt[id] || Date.now(), deleted:true});
      else if (S.items.has(id)) { const it = S.items.get(id); rows.push({user_id:me, id, data:clone(it), updated_at:it.updated || Date.now(), deleted:false}); }
      else S.dirty.delete(id);
    }
    if (S.settingsDirty) {
      // Erst den Stand vom Server holen und zusammenführen, damit ein Gerät mit altem Stand nichts überschreibt
      const {data:srv, error} = await sb.from("items").select("data,updated_at").eq("id", "__settings").maybeSingle();
      if (error) throw error;
      if (srv) { setMerge(srv); changed = true; }
      rows.push({user_id:me, id:"__settings", data:clone(S.settings), updated_at:S.settings.updated, deleted:false});
    }
    const rejected = [];
    for (let i = 0; i < rows.length; i += 200) {
      const part = rows.slice(i, i + 200);
      const {data, error} = await sb.from("items").upsert(part, {onConflict:"user_id,id"}).select("id");
      if (error) throw error;
      if (!data) continue;
      const ok = new Set(data.map(r => r.id)); for (const r of part) if (!ok.has(r.id)) rejected.push(r);
    }
    const rej = new Set(rejected.map(r => r.id));
    for (const r of rows) {
      if (rej.has(r.id)) continue;
      if (r.id === "__settings") { if ((S.settings.updated || 0) === r.updated_at) S.settingsDirty = false; continue; }
      const cur = S.items.get(r.id);
      if (r.deleted ? (!cur && S.tombs.has(r.id)) : (cur && cur.updated === r.updated_at)) { S.dirty.delete(r.id); S.tombs.delete(r.id); delete S.delAt[r.id]; }
    }
    if (rejected.length && await settleRejected(rejected)) changed = true;
    const res = await PC.pullAll(async ({since, after, limit}) => {
      let q = sb.from("items").select("id,data,updated_at,deleted,synced_at").order("synced_at", {ascending:true}).order("id", {ascending:true}).limit(limit);
      if (after) q = q.or(PC.afterFilter(after)); else if (since) q = q.gt("synced_at", since);
      const {data, error} = await q;
      if (error) throw error;
      return data || [];
    }, S.cursor, data => {
      for (const r of data) {
        if (r.id === "__settings") {
          const next = {...clone(DEFAULT_SETTINGS), ...r.data};
          if (!S.settingsDirty && JSON.stringify(S.settings) !== JSON.stringify(next)) { setFromServer(r.data); changed = true; }
          continue;
        }
        if (r.id.startsWith("__")) { if (S.items.delete(r.id)) changed = true; continue; } // Zeilen anderer Apps (Französisch-App, Brand-Weg)
        if (S.dirty.has(r.id)) { const loc = S.items.get(r.id); if (S.tombs.has(r.id) || (loc && (loc.updated || 0) >= r.updated_at)) continue;
          if (loc && loc.kind === "jday" && !r.deleted && r.data && r.data.kind === "jday") { if (PC.mergeJday) { S.items.set(r.id, {...PC.mergeJday(r.data, loc), id:r.id, updated:r.updated_at}); changed = true; scheduleSync(1500); } continue; }
          S.dirty.delete(r.id); }
        if (r.deleted) { if (S.items.delete(r.id)) changed = true; continue; }
        const loc = S.items.get(r.id);
        if (!loc || loc.updated !== r.data.updated) { S.items.set(r.id, {...r.data, id:r.id}); changed = true; }
      }
    });
    S.cursor = res.cursor;
    S.lastSync = Date.now(); S.syncError = null; S.online = true; S.needLogin = false;
    if (res.done) { S.pulledNow = true; if (afterPull()) changed = true; }
    saveLocal();
    if (changed && !S.dragging) { applySettings(); renderAll(); }
    if (!res.done || jdAgain) scheduleSync(1500);
  } catch(e) {
    const msg = (e && (e.message || e.error_description)) || String(e || "");
    if ((e && (e.status === 401 || e.code === "PGRST301")) || /JWT|not authenticated|refresh token/i.test(msg)) S.needLogin = true;
    else if (!navigator.onLine || /fetch|network|load failed/i.test(msg)) S.online = false;
    else S.syncError = msg || "Unbekannter Fehler";
  } finally {
    S.syncing = false; renderStatus();
    if (banner() !== before && !S.dragging) renderMain();
    if ((S.dirty.size || S.settingsDirty) && !S.needLogin && !S.syncError) scheduleSync(8000);
  }
}
// Der Server hatte eine neuere Fassung. Bei allen Arten der App gilt still der Server (keine Konfliktkopie).
async function settleRejected(rows){
  const sent = new Map(rows.map(r => [r.id, r])), names = []; let changed = false;
  for (let i = 0; i < rows.length; i += 100) {
    const {data, error} = await sb.from("items").select("id,data,updated_at,deleted").in("id", rows.slice(i, i + 100).map(r => r.id));
    if (error) throw error;
    for (const srv of data || []) {
      const r = sent.get(srv.id);
      if (srv.id === "__settings") { if ((S.settings.updated || 0) === r.updated_at) { setMerge(srv); changed = true; } continue; }
      const cur = S.items.get(srv.id);
      if (r.deleted ? (cur || !S.tombs.has(srv.id)) : (!cur || cur.updated !== r.updated_at)) continue;
      const res = PC.resolveRejected(r.deleted ? null : cur, srv, {hidden:HIDDEN_K, newId:uid()});
      S.dirty.delete(srv.id); S.tombs.delete(srv.id); delete S.delAt[srv.id];
      if (res.take) S.items.set(srv.id, res.take); else S.items.delete(srv.id);
      if (res.push) S.dirty.add(srv.id);
      if (res.copy) { S.items.set(res.copy.id, res.copy); S.dirty.add(res.copy.id); names.push(cur.title || "Ohne Titel"); }
      changed = true;
    }
  }
  if (names.length) toast(`${names.length} Einträge wurden auf einem anderen Gerät geändert. Meine Fassung liegt als Kopie daneben.`);
  return changed;
}
// Nach dem ersten vollständigen Abgleich dieser Sitzung: Startinhalt, Übernahme alter Daten (je einmal), Papierkorb leeren (über 30 Tage)
function afterPull(){
  if (!S.pulledNow || !PC.loSeed || !PC.loMigrate || !PC.loPurge) return false;
  let ch = false, setCh = false;
  const put = x => { if (S.items.has(x.id)) return; S.items.set(x.id, x); S.dirty.add(x.id); ch = true; };
  if (!S.settings.loSeeded) { PC.loSeed().forEach(put); S.settings.loSeeded = 1; setCh = true; }
  if (!S.settings.loMigrated) { PC.loMigrate(all()).forEach(put); S.settings.loMigrated = 1; setCh = true; }
  const l = lay(), pr = PC.loPurge(all(), l, Date.now());
  for (const id of pr.ids) { const x = S.items.get(id); if (x && LO_KINDS.includes(x.kind)) { S.items.delete(id); S.tombs.add(id); S.delAt[id] = (x.updated || x.trashedAt || 1) + 1; S.dirty.add(id); ch = true; } }
  if (pr.layout.length) { const gone = new Set(pr.layout); const mark = arr => arr.forEach(e => { if (gone.has(e.id)) e.gone = true; });
    mark(l.areas); mark(l.geldTabs); mark(l.buttons); Object.values(l.cols).forEach(mark); S.settings.loLayout = l; setCh = true; }

}

  if (!sb) { S.mode = "setup"; renderAll(); return; }
  let last = null; try { last = JSON.parse(localStorage.getItem(LAST) || "null"); } catch(e){}
  if (last && last.id) { S.user = last; await loadLocal(); S.mode = "app"; startView(); applySettings(); renderAll(); }
  else { S.mode = "login"; renderAll(); }
  checkUpdate();
  sb.auth.onAuthStateChange((ev, session) => { if (ev === "SIGNED_IN" && session) setTimeout(() => onSignedIn(session.user), 0); });
  try {
    const {data} = await sb.auth.getSession();
    if (data && data.session) onSignedIn(data.session.user);
    else if (S.mode === "app" && navigator.onLine) { S.needLogin = true; renderStatus(); renderMain(); }
  } catch(e) {}
}
async function onSignedIn(user){
  const u = {id:user.id, email:user.email};
  const fresh = !S.user || S.user.id !== u.id || S.mode !== "app";
  try { localStorage.setItem(LAST, JSON.stringify(u)); } catch(e){}
  S.user = u; S.needLogin = false;
  if (fresh) { await loadLocal(); S.mode = "app"; startView(); applySettings(); renderAll(); }
  sync();
}
async function logout(){
  clearTimeout(saveT);
  await idb.set(stateKey(), snapshot()).catch(() => {});
  try { await sb.auth.signOut(); } catch(e){}
  try { localStorage.removeItem(LAST); } catch(e){}
  S.user = null; S.items = new Map(); S.settings = clone(DEFAULT_SETTINGS); S.mode = "login"; S.authMode = "login"; S.edit = false; S.sheet = null; S.pulledNow = false; applySettings(); renderAll();
}
function authMsg(e){
  const m = (e && e.message) || "";
  if (/Invalid login/i.test(m)) return "E-Mail oder Passwort stimmt nicht.";
  if (/already registered/i.test(m)) return "Für diese E-Mail gibt es schon ein Konto. Ich kann mich anmelden.";
  if (/Password should/i.test(m)) return "Das Passwort ist zu kurz.";
  if (/Signups not allowed|signup.*disabled/i.test(m)) return "Neue Konten sind gesperrt.";
  if (/Email not confirmed/i.test(m)) return "Zuerst den Link in meiner E-Mail bestätigen.";
  if (/rate limit/i.test(m)) return "Zu viele Versuche. Kurz warten und nochmal versuchen.";
  if (/fetch|network|load failed/i.test(m)) return "Keine Verbindung. Internet prüfen.";
  return m || "Anmeldung fehlgeschlagen.";
}

function saveBlob(blob, name){ const u = URL.createObjectURL(blob); const a = document.createElement("a"); a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 5000); }

async function exportZip(){
  if (!sb || !S.user || !PC.zipParts) return;
  if (!navigator.onLine) { toast("Für die Sicherung mit Dateien brauch ich Internet."); return; }
  const paths = [...new Set(all().flatMap(i => [...(i.files || []), ...(i.shots || [])]).map(f => f && f.path).filter(Boolean))];
  const files = [{name:"backup.json", data:new TextEncoder().encode(backupJSON())}]; let miss = 0;
  if (paths.length) toast(`Lade ${paths.length} Dateien für die Sicherung …`);
  for (const path of paths) {
    const {data, error} = await sb.storage.from("files").download(path);
    if (error || !data) { miss++; continue; }
    files.push({name:"dateien/" + path, data:new Uint8Array(await data.arrayBuffer())});
  }
  saveBlob(new Blob(PC.zipParts(files), {type:"application/zip"}), `para-cockpit-${dkey()}-komplett.zip`);
  toast(miss ? `Sicherung fertig. ${miss} Datei(en) fehlten im Speicher.` : `Sicherung mit ${files.length - 1} Dateien fertig.`);
}
// Einspielen: nur Zusammenführen. Ersetzen gibt es hier absichtlich nicht (würde Einträge löschen, die nicht in der Datei stehen).
async function importData(file){
  try {
    let j, zip = null;
    if (/\.zip$/i.test(file.name) || file.type === "application/zip") {
      zip = await PC.unzip(new Uint8Array(await file.arrayBuffer()));
      const bj = zip.get("backup.json"); if (!bj) throw new Error("In der ZIP-Datei fehlt backup.json.");
      j = JSON.parse(new TextDecoder().decode(bj));
    } else j = JSON.parse(await file.text());
    const b = PC.parseBackup(j);
    if (!b.items.length && !b.settings) throw new Error(b.invalid.length ? "Kein Eintrag in der Datei ist gültig." : "Die Sicherung ist leer.");
    S.pop = {imp:{b, zip, name:file.name, keepNewer:true}}; renderPop();
  } catch(e) { toast(e && e.message && !(e instanceof SyntaxError) ? e.message : "Diese Datei ist keine gültige Sicherung."); }
}

async function applyImport(){
  const m = S.pop && S.pop.imp; if (!m) return;
  const b = m.b, plan = PC.planImport(b, S.items, {keepNewer:m.keepNewer});
  closePop(); S.importing = true;
  try {
  if (b.settings) { S.settings = PC.mergeSettings(S.settings, b.settings); saveSettings(0); }
  const todo = [...plan.add, ...plan.over].map(it => clone(it)); let up = 0, upFail = 0;
  const online = !!(m.zip && sb && S.user && navigator.onLine);
  for (const it of todo) {
    for (const field of ["files", "shots"]) {
      if (!Array.isArray(it[field])) continue;
      it[field] = it[field].filter(f => f && f.path);
      if (!online) continue;
      for (const f of it[field]) {
        const data = m.zip.get("dateien/" + f.path); if (!data) continue;
        const path = PC.repath(f.path, S.user.id), type = f.type || "application/octet-stream";
        const {error} = await sb.storage.from("files").upload(path, new Blob([data], {type}), {contentType:type, upsert:false});
        if (error && !/exist|duplicate/i.test(error.message || "") && String(error.statusCode) !== "409") { upFail++; continue; }
        f.path = path; if (!error) up++;
      }
    }
    persist(it);
  }
  } finally { S.importing = false; }
  renderAll();
  toast(`${todo.length} Einträge eingespielt${up ? `, ${up} Dateien hochgeladen` : ""}${upFail ? `, ${upFail} Dateien fehlgeschlagen` : ""}.`);
}

  const t = e.target;
  if (t.dataset.f) {
    const i = t.dataset.f.indexOf("."), it = getIt(t.dataset.f.slice(0, i)), f = t.dataset.f.slice(i + 1); if (!it) return;
    it[f] = t.value; persist(it, 700);
    if (MONEY_F.has(f)) moneyRefresh();
    if (f === "prod") renderMain();
  } else if (t.dataset.l) {
    S.settings.loLabels = {...(S.settings.loLabels || {}), [t.dataset.l]: t.value}; saveSettings(900);
  } else if (t.id === "days") {
    const n = Math.max(1, Math.min(99, Math.round(+t.value || 0))); if (!t.value) return;
    S.settings.loDays = n; saveSettings(600); clearTimeout(S.daysT); S.daysT = setTimeout(() => { const b = $("#shop-body"); if (b) b.innerHTML = shopBodyHTML(); }, 250);
  } else if (t.id === "plus-t") S.plusDraft = t.value;
  else if (t.dataset.add || t.dataset.addgoal || t.dataset.addpath) S.drafts[t.id] = t.value;
  else if (t.id === "imp-keep" && S.pop && S.pop.imp) { S.pop.imp.keepNewer = t.checked; renderPop(); }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "import-file") { const f = t.files && t.files[0]; if (f) importData(f); t.value = ""; }
  else if (t.dataset.l) { renderHdr(); renderNav(); renderFab(); }
  else if (t.id === "imp-keep" && S.pop && S.pop.imp) { S.pop.imp.keepNewer = t.checked; renderPop(); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && S.pop) { closePop(); return; }
  if (e.key === "Escape" && S.sheet) { closeSheet(); return; }
  if (e.key !== "Enter" || e.isComposing) return;
  const t = e.target;
  if (t.dataset.add) { e.preventDefault(); addTask(t.dataset.add); }
  else if (t.dataset.addgoal) { e.preventDefault(); addGoal(); }
  else if (t.dataset.addpath) { e.preventDefault(); addPath(t.dataset.addpath); }
  else if (t.dataset.f && t.tagName === "TEXTAREA") { e.preventDefault(); t.blur(); }
});
document.addEventListener("submit", async e => {
  if (e.target.id !== "login-form") return;
  e.preventDefault();
  const email = $("#l-email").value.trim(), pw = $("#l-pass").value, msg = $("#l-msg"), btn = $("#l-btn");
  const reg = S.authMode === "signup";
  if (!email || !pw) { msg.textContent = "Bitte E-Mail und Passwort eingeben."; return; }
  if (reg && pw.length < 8) { msg.textContent = "Bitte mindestens 8 Zeichen für das Passwort."; return; }
  btn.disabled = true; msg.textContent = "";
  try {
    const {data, error} = reg ? await sb.auth.signUp({email, password:pw, options:{emailRedirectTo:location.origin + location.pathname}}) : await sb.auth.signInWithPassword({email, password:pw});
    if (error) throw error;
    if (data && data.session) onSignedIn(data.session.user);
    else { msg.style.color = "var(--tinte)"; msg.textContent = "Fast geschafft: Erst den Link in meiner E-Mail bestätigen, dann hier anmelden."; S.authMode = "login"; }
  } catch(err) { msg.textContent = authMsg(err); }
  finally { btn.disabled = false; }
});

/* Sortieren per Ziehen: Griff [data-drag] in einer Liste [data-sort], Einträge mit [data-sid]. Während des Ziehens wird nicht neu gezeichnet. */
let drag = null;
document.addEventListener("pointerdown", e => {
  if (drag || !e.isPrimary || e.button !== 0) return;
  const hnd = e.target.closest("[data-drag]"); if (!hnd || !S.edit) return;
  const el = hnd.closest("[data-sid]"); const box = el && el.parentElement; if (!box || !box.dataset.sort) return;
  e.preventDefault(); drag = {el, box, moved:false, y:e.clientY}; S.dragging = true; el.classList.add("dragging");
  try { hnd.setPointerCapture(e.pointerId); } catch(err){}
});
document.addEventListener("pointermove", e => {
  if (!drag) return; e.preventDefault();
  // Am Bildschirmrand mitscrollen
  const edge = 70; if (e.clientY < edge) window.scrollBy(0, -12); else if (e.clientY > innerHeight - edge) window.scrollBy(0, 12);
  const sh = drag.box.closest(".sheet"); if (sh) { const r = sh.getBoundingClientRect(); if (e.clientY < r.top + 50) sh.scrollTop -= 12; else if (e.clientY > r.bottom - 50) sh.scrollTop += 12; }
  // Ziel = der Eintrag derselben Liste unter dem Finger (auch wenn darin weitere Listen stecken)
  let tgt = document.elementFromPoint(e.clientX, e.clientY);
  while (tgt && tgt.parentElement !== drag.box) tgt = tgt.parentElement;
  if (!tgt || tgt === drag.el || !tgt.dataset.sid) return;
  const r = tgt.getBoundingClientRect(), after = e.clientY > r.top + r.height / 2;
  drag.box.insertBefore(drag.el, after ? tgt.nextSibling : tgt);
  drag.moved = true;
}, {passive:false});
function endDrag(){
  if (!drag) return; const {el, box, moved} = drag; drag = null; S.dragging = false; el.classList.remove("dragging");
  S.justDragged = Date.now(); if (!moved) return;
  const ids = [...box.querySelectorAll(":scope > [data-sid]")].map(n => n.dataset.sid), key = box.dataset.sort;
  if (key.startsWith("lay:")) {
    const list = key.slice(4), l = lay(), arr = layList(l, list);
    const pos = new Map(ids.map((id, i) => [id, i]));
    const sorted = arr.slice().sort((a, b) => (pos.has(a.id) ? pos.get(a.id) : 999) - (pos.has(b.id) ? pos.get(b.id) : 999));
    if (list.startsWith("cols.")) l.cols[list.slice(5)] = sorted; else l[list] = sorted;
    saveLay(l); renderAll(); return;
  }
  ids.forEach((id, i) => { const x = getIt(id); if (x && x.order !== i) { x.order = i; persist(x); } });
  renderAll();
}
document.addEventListener("pointerup", endDrag); document.addEventListener("pointercancel", endDrag);

window.addEventListener("online", () => { S.online = true; renderStatus(); sync(); });
window.addEventListener("offline", () => { S.online = false; renderStatus(); });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { sync(); if (S.mode === "app" && !busy()) renderMain(); } });
setInterval(() => { if (document.visibilityState === "visible") sync(); }, 30000);
boot();
})();
</script>
